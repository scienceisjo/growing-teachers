<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>답 보내기</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#1d1d1f;--ink2:#6e6e73;--line:#d2d2d7;--bg:#f5f5f7;--blue:#0066cc;--blue-t:#eaf2fb;--ok:#1d8a4e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:18px;line-height:1.55;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.3rem;margin:4px 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
.muted{color:var(--ink2);font-size:.92rem}
input[type=text],input[type=number],input[inputmode],textarea{width:100%;font:inherit;font-size:1.1rem;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
textarea{min-height:110px;resize:vertical}
.code{text-transform:uppercase;letter-spacing:.2em;font-size:1.6rem;text-align:center;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-size:1.05rem;font-weight:700;background:var(--blue);color:#fff;margin-top:12px;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.sub{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600}
.q{font-size:1.25rem;font-weight:700;line-height:1.4;margin:0 0 4px}
.kind{display:inline-block;font-size:.8rem;color:var(--blue);background:var(--blue-t);border-radius:999px;padding:2px 10px;margin-bottom:8px;font-weight:600}
.choices{display:grid;gap:10px;margin-top:12px}
.choices button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px;font:inherit;font-size:1.1rem;text-align:left;cursor:pointer;color:var(--ink)}
.choices button.on{border-color:var(--blue);background:var(--blue-t);color:var(--blue);font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.row .unit{font-size:1.1rem;color:var(--ink2);white-space:nowrap}
.sent{color:var(--ok);font-weight:600;font-size:.95rem;margin-top:10px}
.err{color:#b3261e;font-size:.95rem;margin-top:10px}
.wait{text-align:center;padding:26px 6px;color:var(--ink2)}
.wait b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}
details.ask{background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 18px}
details.ask summary{cursor:pointer;padding:16px 0;font-weight:700;list-style:none}
details.ask summary::before{content:"▸ ";color:var(--ink2)}
details.ask[open] summary::before{content:"▾ "}
details.ask .in{padding:0 0 18px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.top .rc{font-size:.85rem;color:var(--ink2)}
.view{padding:12px}
.vhd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 8px}
.vhd b{font-size:.95rem}
.mini{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.vwrap{position:relative;overflow:hidden;border-radius:10px;background:#111;aspect-ratio:16/9}
.vwrap iframe{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.view .muted{margin:8px 2px 0}
[hidden]{display:none!important}
footer#app-credit{width:100%;margin:2.5rem 0 0;padding:14px 12px;text-align:center;font-size:12.5px;line-height:1.6;color:#8a8f98;border-top:1px solid rgba(128,128,128,.25)}
</style>
</head>
<body>
<main>
  <!-- 들어가기 -->
  <section id="join" hidden>
    <h1>답 보내기</h1>
    <div class="card">
      <p class="muted">선생님 화면에 보이는 6자리 코드를 넣어요.</p>
      <input id="code" class="code" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="코드">
      <button class="btn" id="go" type="button">들어가기</button>
      <p class="err" id="joinErr" hidden></p>
    </div>
  </section>

  <!-- 번호 -->
  <section id="numBox" hidden>
    <h1 id="numTitle"></h1>
    <div class="card">
      <p>선생님이 번호를 받기로 했어요. 내 번호를 적어요.</p>
      <input id="num" type="text" inputmode="numeric" maxlength="4" placeholder="번호">
      <button class="btn" id="numGo" type="button">확인</button>
    </div>
  </section>

  <!-- 수업 -->
  <section id="room" hidden>
    <div class="top"><h1 id="title"></h1><span class="rc" id="rc"></span></div>
    <div class="card view" id="viewBox" hidden>
      <div class="vhd"><b>선생님 화면</b><button class="mini" id="viewTog" type="button">접기</button></div>
      <div class="vwrap" id="vwrap"><iframe id="vframe" title="선생님 화면" tabindex="-1" loading="eager"></iframe></div>
      <p class="muted" id="viewNote">선생님이 넘기는 대로 따라가요. 판서와 시뮬레이터 움직임은 칠판에서 봐요.</p>
    </div>
    <div class="card" id="qbox"></div>
    <details class="ask" id="askBox">
      <summary>선생님께 질문 보내기</summary>
      <div class="in">
        <p class="muted">궁금한 것을 언제든 보내요. 이름은 보이지 않아요.</p>
        <textarea id="askText" maxlength="300" placeholder="예) 공기를 뜨거운 물에 넣으면 생수병이 다시 펴질까요?"></textarea>
        <button class="btn" id="askGo" type="button">질문 보내기</button>
        <p class="sent" id="askSent" hidden></p>
      </div>
    </details>
  </section>

  <section id="end" hidden>
    <div class="card wait"><b>수업 방이 닫혔어요.</b>선생님 화면을 봐 주세요.</div>
  </section>
</main>
<footer id="app-credit">© 2026 조승재(과학이조선생) · 해누리중학교 · All rights reserved<br><span style="font-size:11px;opacity:.85;">최종 업데이트: 2026-11-20</span></footer>

<script>window.ANSWERS_MODE = 'student';</script>
<script src="answers.js"></script>
<script>
(function () {
  var A = window.Answers, api = A.api, esc = A.esc;
  var $ = function (id) { return document.getElementById(id); };
  var KINDS = { choice: '고르기', predict: '예측', blank: '빈칸 미리 맞히기', text: '짧은 서술' };
  function show(id) { ['join', 'numBox', 'room', 'end'].forEach(function (s) { $(s).hidden = s !== id; }); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  var device = ls('answers:device');
  if (!device || device.length < 12) { device = 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); ls('answers:device', device); }
  if (A.FAKE && new URLSearchParams(location.search).get('dev')) device = 'test-dev-' + new URLSearchParams(location.search).get('dev');   // 가짜 서버 시험에서만: 한 브라우저로 여러 학생 흉내

  var code = null, info = null, num = null, qKey = 'none', timer = null, misses = 0, inRoom = false;
  var pingOK = true;       // 서버에 answers_v2.sql 이 없으면 false 가 되고, 예전처럼 방 정보만 묻는다
  var mine = {};           // qid -> 내가 보낸 답
  var drafts = {};         // qid -> 쓰던 글(질문이 바뀌었다 돌아와도 남는다)
  var viewUrl = null, viewOpen = ls('answers:view') !== 'off';

  function join(c) {
    c = String(c || '').trim().toUpperCase();
    if (!/^[A-Z0-9]{6}$/.test(c)) { $('joinErr').textContent = '코드는 6자리예요.'; $('joinErr').hidden = false; show('join'); return; }
    $('go').disabled = true;
    api.room(c).then(function (r) {
      $('go').disabled = false;
      if (!r) { $('joinErr').textContent = '그 코드의 수업 방이 없어요. 코드를 다시 확인해요.'; $('joinErr').hidden = false; show('join'); return; }
      code = c; info = r;
      try { mine = JSON.parse(ls('answers:mine:' + c) || '{}'); } catch (e) { mine = {}; }
      num = ls('answers:num:' + c);
      if (r.use_number && !num) { $('numTitle').textContent = r.title || '수업'; show('numBox'); setTimeout(function () { $('num').focus(); }, 50); return; }
      enter();
    }).catch(function () { $('go').disabled = false; $('joinErr').textContent = '연결이 잠깐 끊겼어요. 다시 눌러 봐요.'; $('joinErr').hidden = false; show('join'); });
  }
  function enter() {
    inRoom = true;
    $('title').textContent = info.title || '수업';
    $('rc').textContent = '코드 ' + code + (num ? ' · ' + num + '번' : '');
    show('room'); render(info.cur, true);
    refresh();
    clearInterval(timer); timer = setInterval(refresh, 2000);
  }
  // 2초마다: 방 정보를 받으면서 「보는 중」 신호를 남긴다. 다른 앱으로 넘어간 동안은 묻지 않는다.
  function refresh() {
    if (!inRoom || document.hidden) return;
    var p = pingOK ? api.ping(code, device, num, 'here') : api.room(code);
    p.then(function (r) {
      if (!r) { misses++; if (misses >= 2) { inRoom = false; clearInterval(timer); setView(null); show('end'); } return; }
      misses = 0; info = r; render(r.cur, false);
    }).catch(function (e) { if (pingOK && e && e.status === 404) { pingOK = false; refresh(); } });
  }
  function away() { if (inRoom && pingOK) api.ping(code, device, num, 'away', true).catch(function () {}); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) away(); else refresh(); });
  window.addEventListener('pagehide', away);

  function saveMine() { ls('answers:mine:' + code, JSON.stringify(mine)); }
  function send(q, body, done) {
    body = String(body || '').trim();
    if (!body) return;
    api.submit(code, { qid: q.qid, kind: q.kind, prompt: q.prompt, body: body, num: num, device: device }).then(function (ok) {
      if (ok) { if (q.kind !== 'ask') { mine[q.qid] = body; saveMine(); } done(true); }
      else done(false);
    }).catch(function () { done(false); });
  }
  // cur = {q: 지금 질문 또는 null, view: {url, pos} 또는 null}. 예전 모듈은 질문을 그대로 cur 에 넣었다.
  function render(cur, force) {
    var q = cur ? (cur.q !== undefined ? cur.q : (cur.qid ? cur : null)) : null;
    setView(cur && cur.view ? cur.view : null);
    renderQ(q, force);
  }

  /* 선생님 화면: 같은 강의 화면을 학생용(?s=1)으로 띄우고, 단계만 알려 준다 */
  function viewSrc(v) { return v.url + (v.url.indexOf('?') < 0 ? '?' : '&') + 's=1&ansview=' + encodeURIComponent(code) + (A.FAKE ? '&ansfake=1' : '') + (v.pos || ''); }
  function setView(v) {
    var ok = !!(v && typeof v.url === 'string' && /^https?:\/\//.test(v.url));
    $('viewBox').hidden = !ok;
    $('viewTog').textContent = viewOpen ? '접기' : '보기';
    $('vwrap').hidden = $('viewNote').hidden = !viewOpen;
    if (!ok || !viewOpen) { if (viewUrl) { $('vframe').src = 'about:blank'; viewUrl = null; } return; }
    if (viewUrl !== v.url) { viewUrl = v.url; $('vframe').src = viewSrc(v); fit(); return; }
    try { $('vframe').contentWindow.postMessage({ ans: 'pos', pos: v.pos || '' }, new URL(v.url).origin); } catch (e) {}
  }
  function fit() { var w = $('vwrap').clientWidth; if (w) $('vframe').style.transform = 'scale(' + (w / 1280) + ')'; }
  window.addEventListener('resize', fit);
  $('viewTog').addEventListener('click', function () {
    viewOpen = !viewOpen; ls('answers:view', viewOpen ? null : 'off');
    setView(info && info.cur ? info.cur.view : null); fit();
  });

  function renderQ(q, force) {
    var key = q ? JSON.stringify(q) : 'none';
    if (key === qKey && !force) return;
    qKey = key;
    var box = $('qbox');
    if (!q) { box.innerHTML = '<div class="wait"><b>선생님 화면을 봐요.</b>질문이 나오면 여기에 떠요.</div>'; return; }
    var h = '<span class="kind">' + esc(KINDS[q.kind] || '') + '</span><p class="q">' + esc(q.prompt) + '</p>';
    var prev = mine[q.qid], draft = drafts[q.qid] != null ? drafts[q.qid] : (prev || '');
    if (q.kind === 'choice') {
      h += '<div class="choices">' + (q.choices || []).map(function (c, i) { return '<button type="button" data-i="' + i + '" class="' + (prev === c ? 'on' : '') + '">' + esc(c) + '</button>'; }).join('') + '</div>';
    } else if (q.kind === 'predict') {
      h += '<div class="row" style="margin-top:12px"><input id="qin" type="text" inputmode="decimal" placeholder="숫자" value="' + esc(draft) + '"><span class="unit">' + esc(q.unit || '') + '</span></div>';
      h += '<button class="btn" id="qgo" type="button">보내기</button>';
    } else if (q.kind === 'blank') {
      h += '<input id="qin" type="text" maxlength="40" style="margin-top:12px" placeholder="들어갈 말" value="' + esc(draft) + '">';
      h += '<button class="btn" id="qgo" type="button">보내기</button>';
    } else {
      h += '<textarea id="qin" maxlength="300" style="margin-top:12px" placeholder="내 생각을 적어요">' + esc(draft) + '</textarea>';
      h += '<button class="btn" id="qgo" type="button">보내기</button>';
    }
    h += '<p class="sent" id="qsent"' + (prev ? '' : ' hidden') + '>' + (prev ? '보냈어요. 바꾸려면 다시 보내면 돼요.' : '') + '</p><p class="err" id="qerr" hidden></p>';
    box.innerHTML = h;
    box.querySelectorAll('.choices button').forEach(function (b) {
      b.addEventListener('click', function () {
        var c = q.choices[+b.dataset.i];
        box.querySelectorAll('.choices button').forEach(function (x) { x.classList.toggle('on', x === b); });
        send(q, c, result);
      });
    });
    var qin = $('qin');
    if (qin) qin.addEventListener('input', function () { drafts[q.qid] = qin.value; });
    var go = $('qgo');
    if (go) go.addEventListener('click', function () {
      var v = qin.value;
      if (q.kind === 'predict' && !/-?\d/.test(v)) { $('qerr').textContent = '숫자로 적어요.'; $('qerr').hidden = false; return; }
      go.disabled = true;
      send(q, v, function (ok) { go.disabled = false; if (ok) drafts[q.qid] = null; result(ok); });
    });
  }
  function result(ok) {
    if (ok) { $('qsent').textContent = '보냈어요. 바꾸려면 다시 보내면 돼요.'; $('qsent').hidden = false; $('qerr').hidden = true; }
    else { $('qerr').textContent = '보내지 못했어요. 잠시 뒤 다시 눌러 봐요.'; $('qerr').hidden = false; }
  }
  $('askGo').addEventListener('click', function () {
    var t = $('askText').value, b = this;
    if (!t.trim()) return;
    b.disabled = true;
    send({ qid: 'ask', kind: 'ask', prompt: '학생이 보낸 질문' }, t, function (ok) {
      b.disabled = false;
      $('askSent').hidden = false;
      $('askSent').textContent = ok ? '질문을 보냈어요. 또 보내도 돼요.' : '보내지 못했어요. 잠시 뒤 다시 눌러 봐요.';
      if (ok) $('askText').value = '';
    });
  });
  $('go').addEventListener('click', function () { join($('code').value); });
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') join($('code').value); });
  $('numGo').addEventListener('click', function () {
    var v = $('num').value.trim();
    if (!/^\d{1,4}$/.test(v)) { $('num').focus(); return; }
    num = v; ls('answers:num:' + code, v); enter();
  });

  var c0 = new URLSearchParams(location.search).get('c');
  if (c0) { $('code').value = c0.toUpperCase(); join(c0); } else show('join');
})();
</script>
</body>
</html>
