<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사의 업무 경감 및 자동화 전략 · Notion과 NotebookLM 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#1a1f3a; --ink-soft:#5a6079;
  --paper:#f3f6fb; --card:#ffffff;
  --navy:#12183a; --gold:#c39a35; --gold-deep:#8a6c1c; --gold-soft:#e7d199;
  --red:#e4572e; --blue:#3a6ea5; --yellow:#f6b93b; --teal:#22a699; --grape:#7b6cc4;
  --line:#e5e9f2; --line-soft:#eef1f7;
  --shadow:0 2px 6px rgba(20,25,60,.05),0 12px 32px rgba(20,25,60,.08);
  --shadow-lg:0 10px 24px rgba(20,25,60,.10),0 30px 70px rgba(20,25,60,.14);
  --font-serif:'Noto Serif KR',serif;
  --font-round:'Jua',var(--font-sans);
  --font-sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:
    radial-gradient(circle at 12% 6%, rgba(228,87,46,.08), transparent 30%),
    radial-gradient(circle at 88% 10%, rgba(58,110,165,.10), transparent 32%),
    radial-gradient(circle at 82% 90%, rgba(246,185,59,.10), transparent 32%),
    radial-gradient(circle at 15% 84%, rgba(34,166,153,.08), transparent 32%),
    linear-gradient(180deg,#f6f8fc,#eef2f9);
  background-attachment:fixed;}
::selection{background:var(--gold-soft);color:var(--navy)}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

/* ── decor ── */
.decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;opacity:.14}
.orb::after{content:"";position:absolute;left:8%;right:8%;top:calc(50% - 3px);height:6px;background:rgba(255,255,255,.7);border-radius:6px}
.orb::before{content:"";position:absolute;left:50%;top:50%;width:16%;height:16%;transform:translate(-50%,-50%);background:#fff;border-radius:50%;box-shadow:0 0 0 4px rgba(0,0,0,.12)}
.o1{width:150px;height:150px;top:-40px;left:-30px;background:radial-gradient(circle at 35% 30%,#f19a80,var(--red))}
.o2{width:115px;height:115px;top:22%;right:-30px;background:radial-gradient(circle at 35% 30%,#8fb6dd,var(--blue))}
.o3{width:95px;height:95px;bottom:8%;left:5%;background:radial-gradient(circle at 35% 30%,#7fd3ca,var(--teal))}
.o4{width:130px;height:130px;bottom:-40px;right:9%;background:radial-gradient(circle at 35% 30%,#ffd98a,var(--yellow))}

/* ── top strip + hero ── */
.topstrip{max-width:1120px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand .ball{width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,var(--red) 0 46%,#fff 46% 54%,#fff 54% 100%);border:2px solid var(--navy);position:relative;flex-shrink:0}
.brand .ball::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--navy);border-radius:50%}
.brand .wm{font-family:var(--font-round);font-size:1rem;color:var(--navy)}
.p-flag{display:none;font-size:.72rem;font-weight:800;color:#fff;background:var(--red);padding:5px 11px;border-radius:20px}
body.presenter .p-flag{display:inline-block}
.hero{max-width:1120px;margin:0 auto;padding:12px 22px 22px;text-align:center;position:relative;z-index:1}
.hero h1{font-family:var(--font-round);font-weight:400;font-size:2.3rem;line-height:1.15;color:var(--navy)}
.hero .sub{font-family:var(--font-round);color:var(--red);font-size:1.14rem;margin-top:10px}
.hero .lead{font-size:1.02rem;color:var(--ink-soft);margin:12px auto 0;max-width:620px}
.hero .lead b{color:var(--navy)}
@media(max-width:560px){.hero h1{font-size:1.75rem}.hero .sub{font-size:1rem}}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.act{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 13px;box-shadow:var(--shadow);font-weight:700;font-size:.86rem;color:var(--navy)}

/* ── tabs ── */
.tabbar{position:sticky;top:0;z-index:100;background:rgba(246,248,252,.94);backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabbar-in{max-width:1120px;margin:0 auto;padding:9px 14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabbar-in::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;font-family:var(--font-round);font-size:.98rem;color:var(--ink-soft);background:none;border:2px solid transparent;border-radius:14px;padding:9px 16px;cursor:pointer;transition:.15s;white-space:nowrap}
.tab:hover{background:rgba(195,154,53,.14);color:var(--navy)}
.tab.active{background:var(--navy);color:#fff}
.tab .te{margin-right:5px}
.tabpanel{display:none}
.tabpanel.active{display:block;animation:fadein .32s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tabnav{max-width:1120px;margin:26px auto 0;padding:0 22px;display:flex;justify-content:space-between;gap:12px}
.tabnav button{font-family:var(--font-round);font-size:.96rem;color:var(--navy);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 20px;cursor:pointer;transition:.15s}
.tabnav button:hover{border-color:var(--gold)}
.tabnav button:disabled{opacity:.35;cursor:default}
.tabnav .next{background:linear-gradient(135deg,#20285e,var(--navy));color:#fff;border-color:transparent}

/* ── layout ── */
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.block{padding:36px 0}
.block+.block{border-top:1px dashed var(--line)}
.sec-head{text-align:center;max-width:760px;margin:0 auto 24px}
.sec-head .kick{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-round);font-size:.86rem;color:#fff;background:var(--navy);padding:4px 14px;border-radius:20px;margin-bottom:12px}
.sec-head .kick .tm{color:var(--gold-soft)}
.sec-head h2{font-family:var(--font-round);font-weight:400;color:var(--navy);font-size:1.8rem;line-height:1.25}
.sec-head p{color:var(--ink-soft);font-size:1.02rem;margin-top:8px}

/* ── check-in (보존) ── */
.mood{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 26px;box-shadow:var(--shadow-lg);text-align:center}
.mood .mq{font-family:var(--font-round);font-size:1.3rem;color:var(--navy)}
.mgrid{display:flex;gap:10px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.mo{border:2px solid var(--line);background:#fbfcfe;border-radius:16px;padding:14px 14px;cursor:pointer;transition:.15s;min-width:78px}
.mo:hover{border-color:var(--gold);transform:translateY(-3px)}
.mo.on{border-color:transparent;background:linear-gradient(135deg,#20285e,var(--navy));color:#fff;transform:translateY(-3px)}
.mo .e{font-size:1.9rem}
.mo .t{font-weight:700;font-size:.82rem;margin-top:6px}
.mnote{margin-top:16px;font-size:.98rem;color:var(--ink-soft);min-height:1.4em}
.mnote b{color:var(--navy)}
.startpanel{max-width:640px;margin:18px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.startpanel{grid-template-columns:1fr}}
.spcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.spcard .spqr{width:104px;height:104px;border-radius:12px;background:#fbf7ec;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line)}
.spcard .spqr img{width:100%;height:100%;object-fit:contain}
.spcard .spt{font-family:var(--font-round);color:var(--navy);font-size:1.02rem}
.spcard .spd{font-size:.82rem;color:var(--ink-soft);line-height:1.45}
.spcard .spb{margin-top:auto;font-family:var(--font-round);font-size:.9rem;color:#fff;background:linear-gradient(135deg,#20285e,var(--navy));border-radius:11px;padding:9px 16px;text-decoration:none}
.spcard .spb.tcol{background:linear-gradient(135deg,var(--red),#c8431f)}

/* ── tool groups ── */
.toolgroup{max-width:960px;margin:0 auto 22px}
.tg-h{font-family:var(--font-round);color:var(--navy);font-size:1.16rem;display:flex;align-items:center;gap:8px;margin:0 0 12px 4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 14px;text-align:center;text-decoration:none;box-shadow:var(--shadow);transition:.16s;display:block}
a.tile:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow-lg)}
.tile .te{font-size:2.1rem;line-height:1}
.tile .tn{font-family:var(--font-round);color:var(--navy);font-size:1.02rem;margin-top:9px}
.tile .tg{font-size:.74rem;color:var(--gold-deep);font-weight:700;margin-top:3px}
.tile.multi{display:flex;flex-direction:column;align-items:center}
.tlinks{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.tlink{font-family:var(--font-round);font-size:.8rem;color:var(--navy);background:#f2ecdd;border:1px solid var(--gold-soft);border-radius:9px;padding:6px 11px;text-decoration:none;transition:.15s}
.tlink:hover{background:var(--gold-soft)}
.tile.feat{grid-column:1/-1;text-align:left;padding:20px 22px}
.tile.feat .feat-hd{display:flex;align-items:center;gap:12px}
.tile.feat .feat-hd .tn{margin-top:0}
.tile.feat .feat-hd .tg{margin-top:2px}
.tile.feat .feat-desc{margin-top:12px;font-size:.92rem;color:var(--ink);line-height:1.66}
.tile.feat .feat-desc b{color:var(--navy)}
.tile.feat .feat-ex{margin-top:12px;background:#f8faff;border:1px solid var(--line);border-radius:12px;padding:12px 15px}
.tile.feat .fex-h{font-family:var(--font-round);color:var(--navy);font-size:.9rem;margin-bottom:7px}
.tile.feat .feat-ex ul{margin:0;padding-left:18px}
.tile.feat .feat-ex li{font-size:.88rem;color:var(--ink-soft);line-height:1.6;margin:4px 0}
.tile.feat .feat-ex li b{color:var(--gold-deep)}
.tile.feat .tlinks{justify-content:flex-start;margin-top:14px}

/* ── 강사 소개 ── */
.introcard{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 30px;box-shadow:var(--shadow);text-align:center}
.introcard .avatar{width:86px;height:86px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,#eef2fb,#e3ecfa);display:flex;align-items:center;justify-content:center;font-size:2.7rem;border:2px solid var(--gold-soft)}
.introcard .iname{font-family:var(--font-round);color:var(--navy);font-size:1.62rem;margin-top:14px}
.introcard .irole{display:inline-block;margin-top:7px;font-size:.86rem;font-weight:700;color:var(--gold-deep);background:#fbf5e7;border:1px solid var(--gold-soft);border-radius:999px;padding:4px 15px}
.introcard .iletter{margin-top:16px;font-size:1.02rem;color:var(--ink);line-height:1.72}
.introcard .iletter b{color:var(--navy)}
.introcard .ihumble{margin-top:12px;font-size:.92rem;color:var(--ink-soft);line-height:1.65}
.introcard .iphoto{margin:20px auto 0;max-width:430px}
.introcard .iphoto img{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.introcard .iphoto figcaption{font-size:.82rem;color:var(--ink-soft);margin-top:8px}
.introcard .iphoto.noimg img{display:none}
.introcard .iphoto .phf{display:none}
.introcard .iphoto.noimg .phf{display:flex;align-items:center;justify-content:center;background:#f1f4fb;border:1px dashed var(--line);border-radius:14px;padding:30px 20px;color:var(--ink-soft);font-size:.85rem;text-align:center}
.introcard details.toggle{margin-top:20px;text-align:left}
.introcard .creds{margin:10px 0 0;padding-left:20px}
.introcard .creds li{font-size:.92rem;color:var(--ink-soft);line-height:1.6;margin:5px 0}

/* ── compare ── */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:900px;margin:0 auto}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmpcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);border-top:5px solid var(--blue)}
.cmpcard.nb{border-top-color:var(--red)}
.cmpcard .ci{font-size:2rem}
.cmpcard .cn{font-family:var(--font-round);color:var(--navy);font-size:1.3rem;margin-top:6px}
.cmpcard .cr{color:var(--ink-soft);font-size:.96rem;margin-top:8px;line-height:1.6}
.cmpcard .cdo{margin-top:14px;background:#f7f9fd;border-radius:12px;padding:12px 14px;font-size:.9rem}
.cmpcard .cdo .lab{font-family:var(--font-round);color:var(--gold-deep);font-size:.82rem;display:block;margin-bottom:4px}

/* ── tables ── */
.tablewrap{max-width:920px;margin:0 auto;overflow-x:auto;border-radius:16px;box-shadow:var(--shadow)}
table.data{width:100%;border-collapse:collapse;background:var(--card);font-size:.95rem;min-width:420px}
table.data th,table.data td{padding:11px 14px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
table.data thead th{background:#f2ecdd;color:var(--navy);font-family:var(--font-round);font-weight:400;font-size:.9rem}
table.data tbody th{font-weight:700;color:var(--navy);white-space:nowrap}
table.data tr:last-child td,table.data tr:last-child th{border-bottom:none}
table.data td b{color:var(--navy)}
.note-under{max-width:920px;margin:12px auto 0;font-size:.86rem;color:var(--ink-soft);background:#f7f9fd;border-left:3px solid var(--gold);border-radius:10px;padding:11px 14px;line-height:1.55}

/* ── account/warn ── */
.acct{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:920px;margin:0 auto 18px}
@media(max-width:640px){.acct{grid-template-columns:1fr}}
.acard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow)}
.acard.school{border:2px solid var(--red)}
.acard .ah{font-family:var(--font-round);color:var(--navy);font-size:1.12rem;display:flex;align-items:center;gap:8px}
.acard ul{list-style:none;margin-top:12px;display:grid;gap:7px}
.acard li{position:relative;padding-left:20px;font-size:.9rem;color:var(--ink-soft);line-height:1.5}
.acard li::before{content:"›";position:absolute;left:4px;color:var(--gold);font-weight:800}
.acard li b{color:var(--ink)}
.warn-card{max-width:920px;margin:0 auto 18px;background:#fff5ef;border:2px solid var(--red);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow)}
.warn-card .wh{font-family:var(--font-round);color:var(--red);font-size:1.16rem;display:flex;align-items:center;gap:8px}
.warn-card p{margin-top:8px;font-size:.96rem;color:var(--ink);line-height:1.65}
.warn-card p b{color:var(--red)}
.warn-card ul{margin:10px 0 0 0;list-style:none;display:grid;gap:6px}
.warn-card li{position:relative;padding-left:20px;font-size:.9rem;color:var(--ink-soft);line-height:1.5}
.warn-card li::before{content:"✓";position:absolute;left:2px;color:var(--red);font-weight:800}

.featchips{display:flex;flex-wrap:wrap;gap:8px;max-width:920px;margin:0 auto}
.fc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:.88rem;font-weight:600;color:var(--navy);box-shadow:var(--shadow);display:flex;align-items:center;gap:7px}
.fc .fce{font-size:1rem}

/* ── SenGPT box ── */
.sengpt-box{max-width:920px;margin:22px auto 0;background:linear-gradient(135deg,#1a2450,var(--navy));color:#eaf0ff;border-radius:20px;padding:24px 26px;box-shadow:var(--shadow-lg)}
.sengpt-box .sh{font-family:var(--font-round);color:#fff;font-size:1.24rem;display:flex;align-items:center;gap:8px}
.sengpt-box .sp{color:#c9d0ee;font-size:.94rem;margin-top:8px;line-height:1.65}
.sengpt-box .sp b{color:var(--gold-soft)}
.sengpt-box .stip{margin-top:14px;font-size:.85rem;color:#c9d0ee;background:rgba(0,0,0,.22);border-radius:10px;padding:10px 13px;line-height:1.55}

/* ── buttons ── */
.btnrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:0 auto 20px;max-width:760px}
.btn-lg{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--font-round);font-size:1.02rem;padding:12px 22px;border-radius:14px;box-shadow:var(--shadow);transition:.15s;cursor:pointer;border:none}
.btn-lg:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn-lg.primary{color:#fff;background:linear-gradient(135deg,var(--red),#c8431f)}
.btn-lg.dark{color:#fff;background:linear-gradient(135deg,#20285e,var(--navy))}
.btn-lg.ghost{color:var(--navy);background:var(--card);border:2px solid var(--line)}
.btn-lg.ghost:hover{border-color:var(--gold)}

/* ── steps / checklist ── */
.bsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;max-width:980px;margin:0 auto}
.bstep{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.bstep .bn{position:absolute;top:-10px;right:-6px;font-family:var(--font-round);font-size:3.4rem;color:rgba(195,154,53,.16)}
.bstep .bi{font-size:1.9rem}
.bstep .bh{font-family:var(--font-round);color:var(--navy);font-size:1.14rem;margin-top:10px}
.bstep .bb{color:var(--ink-soft);font-size:.9rem;margin-top:7px;line-height:1.55}
.bstep .bb b{color:var(--ink)}
.bstep.accent-red{border-top:4px solid var(--red)}.bstep.accent-blue{border-top:4px solid var(--blue)}
.bstep.accent-teal{border-top:4px solid var(--teal)}.bstep.accent-yellow{border-top:4px solid var(--yellow)}
.checklist{max-width:640px;margin:22px auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 24px;box-shadow:var(--shadow)}
.checklist .clh{font-family:var(--font-round);color:var(--navy);font-size:1.08rem;margin-bottom:12px}
.checklist label{display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer;font-size:.96rem;border-bottom:1px solid var(--line-soft)}
.checklist label:last-child{border-bottom:none}
.checklist input{width:20px;height:20px;margin-top:1px;accent-color:var(--teal);flex-shrink:0;cursor:pointer}
.checklist input:checked + span{color:var(--ink-soft);text-decoration:line-through}

/* ── prompts / vs-AI / studio ── */
.prompts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px;max-width:920px;margin:0 auto}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.pcard .ptxt{flex:1;font-size:.94rem;color:var(--ink);line-height:1.5}
.pcard .pcopy{flex-shrink:0;font-family:var(--font-round);font-size:.82rem;color:var(--navy);background:#f2ecdd;border:1px solid var(--gold-soft);border-radius:10px;padding:7px 12px;cursor:pointer;transition:.15s;white-space:nowrap}
.pcard .pcopy:hover{background:var(--gold-soft)}
.pcard .pcopy.done{background:var(--teal);color:#fff;border-color:var(--teal)}
.vsbox{max-width:920px;margin:0 auto 4px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow)}
.vsbox .vh{font-family:var(--font-round);color:var(--navy);font-size:1.16rem;margin-bottom:10px}
.vsbox ul{list-style:none;display:grid;gap:9px}
.vsbox li{position:relative;padding-left:26px;font-size:.95rem;color:var(--ink-soft);line-height:1.55}
.vsbox li::before{content:"✔";position:absolute;left:2px;color:var(--teal);font-weight:800}
.vsbox li b{color:var(--navy)}

/* ═══ RENDER helpers ═══ */
const $=id=>document.getElementById(id);
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function rich(s){return esc(s).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>').replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
  .replace(/\{\{(.+?)\}\}/g,(m,a)=>'<span class="blank" role="button" tabindex="0" data-a="'+a.replace(/"/g,'&quot;')+'" onclick="revealBlank(this)" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();revealBlank(this)}">❓</span>')
  .replace(/\n/g,'<br>')}
let _ac=null;
function playPop(){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const t=_ac.currentTime;const o=_ac.createOscillator(),g=_ac.createGain();o.type='triangle';o.frequency.setValueAtTime(540,t);o.frequency.exponentialRampToValueAtTime(920,t+0.09);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);o.connect(g);g.connect(_ac.destination);o.start(t);o.stop(t+0.26);}catch(e){}}
function revealBlank(el){if(el.classList.contains('on'))return;el.classList.add('on');el.textContent=el.dataset.a;playPop();}
function head(kick,tm,h,p){return '<div class="sec-head">'+((kick||tm)?'<span class="kick">'+(tm?'<span class="tm">'+esc(tm)+'</span> · ':'')+esc(kick)+'</span>':'')+'<h2>'+rich(h)+'</h2>'+(p?'<p>'+rich(p)+'</p>':'')+'</div>'}
function dataTable(hd,rows){let h='<table class="data"><thead><tr>'+hd.map(x=>'<th scope="col">'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';rows.forEach(r=>{h+='<tr><th scope="row">'+rich(r[0])+'</th>'+r.slice(1).map(c=>'<td>'+rich(c)+'</td>').join('')+'</tr>';});return h+'</tbody></table>'}
function chips(arr){return '<div class="featchips">'+arr.map(f=>'<span class="fc"><span class="fce">'+f[0]+'</span>'+esc(f[1])+'</span>').join('')+'</div>'}

function pickMood(el){document.querySelectorAll('.mo').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  const n=['가득이시네요! 오늘 만든 것을 바로 써 보시기 딱 좋습니다.','좋습니다. 오늘은 <b>딱 하나만</b> 확실히 챙겨 가세요.','반쯤이면 충분합니다. <b>하나 덜어내는 법</b>만 가져가세요.','조금 지치셨군요. 그래서 오늘 주제가 <b>업무 경감</b>입니다.','바닥이라 느끼시는 그 마음이 오늘의 출발점입니다. 잘 오셨습니다.'];
  $('mnote').innerHTML=n[+el.dataset.i]||'';}
let toastT=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1600);}
function copyPrompt(i,btn){const txt=$('pt'+i).textContent;const done=()=>{btn.textContent='복사됨 ✓';btn.classList.add('done');toast('프롬프트를 복사했습니다.');setTimeout(()=>{btn.textContent='복사';btn.classList.remove('done')},1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(()=>fb(txt,done));else fb(txt,done);
  function fb(t,cb){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);cb();}}
function copyTemplate(btn,id){const el=$(id||'nlmTpl');if(!el)return;const txt=el.innerText;
  const done=()=>{const o=btn.textContent;btn.textContent='복사됨 ✓';btn.classList.add('done');toast('템플릿을 복사했습니다. AI 채팅에 붙여넣으세요.');setTimeout(()=>{btn.textContent=o;btn.classList.remove('done')},1600);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(()=>done());
  else{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);done();}}
let lastFocus=null;
function openModal(img){if(!img)return;lastFocus=document.activeElement;$('modalImg').src=img.src;$('modalImg').alt=img.alt;$('modalCap').textContent=img.alt;$('modal').classList.add('open');$('mclose').focus();}
function closeModal(){$('modal').classList.remove('open');$('modalImg').src='';if(lastFocus)lastFocus.focus();}

function liveReady(){return CONFIG.supabaseUrl&&CONFIG.supabaseAnonKey}
function initLive(){
  if(!liveReady()){[1,2,3].forEach(n=>{const st=$('liveStatus'+n),sd=$('liveSend'+n),wl=$('wall'+n);if(st)st.innerHTML='ℹ️ 라이브 벽은 <b>Supabase 연결 후</b> 켜집니다.';if(sd)sd.disabled=true;if(wl)wl.innerHTML='<div class="bubble"><div class="bt">여기에 선생님들의 아이디어가 실시간으로 쌓입니다.</div><div class="bm">— 예시</div></div>';});return;}
  function boot(){try{sb=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);}catch(e){return;}[1,2,3].forEach(loadWall);setInterval(()=>[1,2,3].forEach(loadWall),6000);}
  if(window.supabase)boot();else{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=boot;document.head.appendChild(s);}
}
async function loadWall(n){if(!sb)return;const {data,error}=await sb.from(CONFIG.liveTable).select('*').eq('prompt',WALLKEY[n]).order('created_at',{ascending:false}).limit(60);if(error){const st=$('liveStatus'+n);if(st)st.textContent='읽기 오류: '+error.message;return;}const wl=$('wall'+n);if(wl)wl.innerHTML=(data||[]).map(r=>'<div class="bubble'+(myIds[n].has(r.id)?' mine':'')+'"><div class="bt">'+esc(r.body)+'</div><div class="bm">— '+esc(r.name||'익명')+'</div></div>').join('')||'<div class="bubble"><div class="bt">첫 번째 아이디어를 남겨 보세요!</div></div>';}
async function submitLive(n){const bd=$('liveBody'+n),body=bd.value.trim();if(!body){bd.focus();return;}if(!liveReady()){$('liveStatus'+n).innerHTML='먼저 Supabase를 연결해 주세요.';return;}if(!sb){$('liveStatus'+n).textContent='연결 준비 중입니다. 잠시 후 다시 시도해 주세요.';return;}const name=$('liveName'+n).value.trim().slice(0,12);$('liveSend'+n).disabled=true;$('liveStatus'+n).textContent='남기는 중...';const {data,error}=await sb.from(CONFIG.liveTable).insert({name,body,prompt:WALLKEY[n]}).select();$('liveSend'+n).disabled=false;if(error){$('liveStatus'+n).innerHTML='저장 오류: '+esc(error.message);return;}if(data&&data[0])myIds[n].add(data[0].id);bd.value='';$('liveStatus'+n).innerHTML='✅ 고맙습니다! 화면에 표시되었습니다.';loadWall(n);toast('아이디어가 등록되었습니다.');}

/* ═══ 탭 전환 ═══ */
let curTab='start';
function showTab(id){
  curTab=id;
  document.querySelectorAll('#tabbar .tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('#panels .tabpanel').forEach(p=>p.classList.toggle('active',p.dataset.tab===id));
  const idx=TABS.findIndex(t=>t.id===id);
  const prev=$('navPrev'),next=$('navNext');
  if(prev){prev.disabled=idx<=0;prev.onclick=()=>showTab(TABS[Math.max(0,idx-1)].id);}
  if(next){next.disabled=idx>=TABS.length-1;next.textContent=idx>=TABS.length-1?'끝!':('다음: '+TABS[idx+1].label+' →');next.onclick=()=>showTab(TABS[Math.min(TABS.length-1,idx+1)].id);}
  window.scrollTo({top:0,behavior:'auto'});
  location.hash=id;
}

/* ═══ presenter ═══ */
function initPresenter(){const q=new URLSearchParams(location.search);if(q.get('present')==='1'||q.has('present')){document.body.classList.add('presenter');$('modeHint').innerHTML='🎤 강사용 화면(참가자에겐 <code>?present=1</code> 없는 주소를 배포)';}}
function renderDecor(){$('decor').innerHTML='<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>';}

document.addEventListener('DOMContentLoaded',()=>{
  $('acts').innerHTML=DATA.acts.map(a=>'<span class="act">'+a.e+' '+esc(a.t)+'</span>').join('');
  $('tabbar').innerHTML=TABS.map(t=>'<button class="tab" data-tab="'+t.id+'" onclick="showTab(\''+t.id+'\')"><span class="te">'+t.e+'</span>'+esc(t.label)+'</button>').join('');
  $('panels').innerHTML=TABS.map(t=>'<div class="tabpanel" data-tab="'+t.id+'">'+panelHTML(t.id)+'</div>').join('')+
    '<div class="tabnav"><button id="navPrev">← 이전</button><button id="navNext" class="next">다음 →</button></div>';
  // hero presenter note
  $('panels').insertAdjacentHTML('afterbegin','');
  renderDecor(); initPresenter(); initLive();
  $('mclose').addEventListener('click',closeModal);
  $('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').classList.contains('open'))closeModal();});
  const start=(location.hash||'').replace('#','');
  showTab(TABS.some(t=>t.id===start)?start:'start');
});
</script>
</body>
</html>
