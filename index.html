<!DOCTYPE html>
<!--
  잠시 닫아 둔 화면 (2026-11-26).
  원래 포트폴리오는 git 태그 portfolio-before-maintenance (커밋 eaeb677) 에 그대로 있다.
  되돌리기: git checkout portfolio-before-maintenance -- index.html
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조승재 · 업데이트 중</title>
<meta name="description" content="업데이트 중입니다.">
<link rel="icon" href="images/profile.webp">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --blue:#0066cc;
  --ink:#1d1d1f;
  --track:#e8e8ed;
  --orbit:#d2d2d7;
  --canvas:#ffffff;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--canvas);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:grid;place-items:center;min-height:100svh;padding:24px 16px;overflow-x:hidden;
}
main{display:flex;flex-direction:column;align-items:center;text-align:center}

/* 가운데 프로필 그림 + 둘레를 도는 전자 궤도 세 개 */
.stage{position:relative;width:min(400px,88vw);aspect-ratio:1}
.orbits{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbits ellipse{fill:none;stroke:var(--orbit);stroke-width:1.4}
.orbits .e{fill:var(--blue)}
.portrait{
  position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;height:auto;
  border-radius:50%;object-fit:cover;background:#fcf4e1;
  transform:translate(-50%,-50%);
  animation:bob 3.2s ease-in-out infinite;
}
@keyframes bob{
  0%,100%{transform:translate(-50%,-50%)}
  50%{transform:translate(-50%,calc(-50% - 6px))}
}

h1{
  margin-top:4px;
  font-size:clamp(28px,6.4vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.2;
}

/* 끝없이 차오르는 막대 */
.bar{
  position:relative;overflow:hidden;
  width:min(220px,56vw);height:4px;margin-top:22px;
  border-radius:9999px;background:var(--track);
}
.bar::after{
  content:"";position:absolute;top:0;bottom:0;left:0;width:38%;
  border-radius:inherit;background:var(--blue);
  animation:slide 1.6s cubic-bezier(.45,0,.25,1) infinite;
}
@keyframes slide{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(265%)}
}

@media (prefers-reduced-motion:reduce){
  .portrait,.bar::after{animation:none}
  .bar::after{width:62%}
}
</style>
</head>
<body>
<main>
  <div class="stage">
    <svg class="orbits" viewBox="-200 -200 400 400" aria-hidden="true">
      <g transform="rotate(-28)">
        <ellipse rx="186" ry="64"/>
        <circle class="e" r="6.5">
          <animateMotion dur="3.4s" repeatCount="indefinite" begin="0s"
            path="M186,0 A186,64 0 1,1 -186,0 A186,64 0 1,1 186,0"/>
        </circle>
      </g>
      <g transform="rotate(32)">
        <ellipse rx="186" ry="64"/>
        <circle class="e" r="6.5">
          <animateMotion dur="4.6s" repeatCount="indefinite" begin="-1.5s"
            path="M-186,0 A186,64 0 1,0 186,0 A186,64 0 1,0 -186,0"/>
        </circle>
      </g>
      <g transform="rotate(90)">
        <ellipse rx="186" ry="64"/>
        <circle class="e" r="6.5">
          <animateMotion dur="5.8s" repeatCount="indefinite" begin="-3s"
            path="M186,0 A186,64 0 1,1 -186,0 A186,64 0 1,1 186,0"/>
        </circle>
      </g>
    </svg>
    <img class="portrait" src="images/profile.webp" width="720" height="720" alt="흰 가운을 입고 엄지를 든 조승재 캐리커처">
  </div>

  <h1>업데이트 중입니다!</h1>
  <div class="bar" role="progressbar" aria-label="업데이트 중"></div>
</main>
<script>
  // 움직임 줄이기를 켠 기기에서는 궤도 전자도 멈춘다
  try{
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){
      document.querySelector('.orbits').pauseAnimations();
    }
  }catch(e){}
</script>
</body>
</html>
