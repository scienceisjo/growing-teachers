<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GiteacherHub · 선생님들이 만든 교실 앱</title>

<style>
:root{
  --blue:#0066cc;--blue-h:#0071e3;--blue-dark:#2997ff;--tint:rgba(0,102,204,.07);
  --ink:#1d1d1f;--ink2:#333336;--muted:#6e6e73;--muted2:#86868b;
  --line:#e0e0e0;--soft:#f5f5f7;--pearl:#fafafc;
  --ok:#1d8a4e;--warn:#9a6b00;--bad:#b3261e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:#fff;color:var(--ink);font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;font-size:17px;line-height:1.47;letter-spacing:-.022em;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--blue)}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.pad{padding-top:28px;padding-bottom:40px}
.narrow{max-width:760px}
[hidden]{display:none!important}

/* 상단 바 */
.nav{position:sticky;top:0;z-index:50;height:52px;background:rgba(255,255,255,.84);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.nav .in{max-width:1180px;margin:0 auto;height:100%;display:flex;align-items:center;gap:18px;padding:0 22px}
.logo{display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;font-weight:600;font-size:19px;letter-spacing:-.025em}
.logo img{width:28px;height:28px;display:block}
.logo .t{color:var(--blue)}
.nav .sp{flex:1}
.nav .nl{color:var(--ink);text-decoration:none;font-size:14px;opacity:.8}
.nav .nl:hover{opacity:1}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 22px;border-radius:980px;font-size:16px;font-weight:500;cursor:pointer;border:1px solid transparent;text-decoration:none;white-space:nowrap;background:transparent;color:var(--blue)}
.btn:hover{text-decoration:underline}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-h);text-decoration:none}
.btn.line{border-color:var(--line);color:var(--ink);background:#fff}
.btn.line:hover{border-color:#c7c7cc;text-decoration:none}
.btn.sm{min-height:34px;padding:0 14px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default;text-decoration:none}

/* 글자 */
.eyebrow{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,48px);line-height:1.08;font-weight:600;letter-spacing:-.03em;margin:0}
h2{font-size:clamp(22px,3vw,28px);line-height:1.15;font-weight:600;letter-spacing:-.025em;margin:0 0 14px}
.lead{font-size:clamp(17px,2.2vw,21px);color:var(--muted);margin:14px 0 0;line-height:1.4}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.empty{color:var(--muted);text-align:center;padding:36px 0}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;letter-spacing:0;word-break:break-all}
.back{display:inline-block;color:var(--blue);text-decoration:none;font-size:15px;margin:0 0 18px}
.back:hover{text-decoration:underline}

/* 첫 화면 */
.hero{background:var(--soft);text-align:center;padding:78px 22px 66px}
.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.07}
.hero .lead{max-width:640px;margin:18px auto 0}
.hero .cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:28px 0 0}
.hero .stat{margin:22px 0 0;font-size:14px;color:var(--muted)}
.hero .stat b{color:var(--ink);font-weight:600}

/* 칩과 거르기 */
.browse{padding:36px 0 64px}
.filters{padding:4px 0 18px;border-bottom:1px solid var(--line)}
.frow{display:flex;align-items:center;gap:12px;margin:0 0 10px;min-width:0}
.frow .fl{flex:none;width:46px;font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 1px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chips.wrapit{flex-wrap:wrap;overflow:visible}
.chip{flex:none;min-height:34px;padding:0 14px;border-radius:980px;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#c7c7cc}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .n{color:var(--muted2);margin-left:5px;font-size:12px}
.chip[aria-pressed="true"] .n{color:rgba(255,255,255,.82)}
.search{margin:12px 0 0}
.search input{max-width:420px}

/* 카드 */
.group{margin:40px 0 0}
.group h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.group h2 small{font-size:15px;color:var(--muted);font-weight:500;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{display:flex;flex-direction:column;background:var(--soft);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s ease}
.card:hover{transform:translateY(-3px)}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.thumb{aspect-ratio:16/10;background:#fff;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.tile{width:84px;height:84px;border-radius:20px;background:var(--soft);display:grid;place-items:center;font-size:38px;font-weight:600;color:var(--ink);letter-spacing:0}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:18px;line-height:1.3;font-weight:600;margin:0;letter-spacing:-.02em}
.card .sum{font-size:15px;color:var(--muted);margin:0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0;font-size:12.5px}
.meta span{padding:3px 10px;border-radius:980px;background:#fff;color:var(--ink2)}
.card .by{margin:auto 0 0;padding-top:10px;font-size:13px;color:var(--muted2);display:flex;justify-content:space-between;gap:8px}
.notice{background:var(--soft);border-radius:18px;padding:34px 24px;text-align:center;margin:36px 0 0}
.notice b{font-size:19px}
.notice p{color:var(--muted);margin:8px 0 18px}

/* 검은 띠 */
.dark{background:#000;color:#f5f5f7;text-align:center;padding:76px 0}
.dark h2{font-size:clamp(28px,4vw,40px);margin:0 0 30px}
.dark .eyebrow{color:#a1a1a6}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:920px;margin:0 auto 26px;text-align:left}
.steps3 div{background:#1d1d1f;border-radius:18px;padding:24px}
.steps3 b{display:block;font-size:13px;color:var(--blue-dark);margin:0 0 8px}
.steps3 p{margin:0;font-size:16px;line-height:1.5;color:#f5f5f7}
.dark .sub{color:#a1a1a6;font-size:15px;margin:0 0 22px}

/* 상세 */
.dh{margin:0 0 26px}
.dh .meta span{background:var(--soft)}
.dh .meta .by{background:transparent;color:var(--muted);padding-left:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--soft);border-radius:980px;padding:3px}
.seg button{min-height:32px;padding:0 16px;border:0;background:transparent;border-radius:980px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;font-weight:600}
.stage{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.stage iframe{display:block;width:100%;height:72vh;min-height:480px;border:0;background:#fff}
.stage.phone{border:0;background:var(--soft);display:flex;justify-content:center;padding:26px 0}
.stage.phone iframe{width:390px;max-width:calc(100% - 20px);height:760px;min-height:0;border:10px solid #1d1d1f;border-radius:46px}
.stage.small iframe{height:420px;min-height:0}
.stage .empty{padding:80px 0}
.note{font-size:14px;color:var(--muted);margin:12px 0 0}

/* 의견 */
.comments{margin:48px 0 0;padding:32px 0 0;border-top:1px solid var(--line)}
.comments h2 span{color:var(--muted);font-weight:500}
.clist{list-style:none;margin:0 0 22px;padding:0}
.clist li{padding:16px 0;border-bottom:1px solid var(--line)}
.clist li.empty{border:0;padding:10px 0 20px;text-align:left}
.ch{display:flex;gap:10px;align-items:baseline;margin:0 0 4px;font-size:14px}
.ch span{color:var(--muted2);font-size:13px}
.cb{margin:0;white-space:pre-wrap;font-size:16px}
.cform{display:flex;flex-direction:column;gap:10px;max-width:720px}
.cform input{max-width:260px}
.frow2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.frow2.center{justify-content:center}
.own{margin:40px 0 0;border-top:1px solid var(--line);padding:18px 0 0}
.own summary{cursor:pointer;color:var(--muted);font-size:15px}
.own>div{padding:18px 0 0;max-width:620px}

/* 입력 */
input[type=text],input[type=password],input[type=search],input[type=url],input[type=date],select,textarea{font:inherit;font-size:16px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);width:100%;letter-spacing:-.01em}
textarea{resize:vertical;min-height:96px;line-height:1.5}
textarea.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;letter-spacing:0;min-height:170px}
input:focus,select:focus,textarea:focus,.drop:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.field{display:flex;flex-direction:column;gap:7px;margin:0 0 20px}
.field>label,.field>.lb{font-size:15px;font-weight:600}
.field em{color:var(--bad);font-style:normal}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:4px 0 22px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--blue);flex:none}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:118px;border:1.5px dashed #c7c7cc;border-radius:18px;padding:22px;text-align:center;cursor:pointer;background:var(--pearl)}
.drop.on{border-color:var(--blue);background:var(--tint)}
.drop.ok{border-style:solid;border-color:var(--line);background:#fff}
.drop.sm{min-height:64px;padding:14px}
.drop img{max-width:100%;max-height:220px;border-radius:11px;display:block}
.tabs2{display:inline-flex;background:var(--soft);border-radius:980px;padding:3px;align-self:flex-start}
.tabs2 button{min-height:32px;padding:0 16px;border:0;background:transparent;border-radius:980px;font-size:14px;cursor:pointer}
.tabs2 button[aria-pressed="true"]{background:#fff;font-weight:600}

/* 올리기 */
.up h1{margin:0 0 6px}
.stepper{display:flex;gap:8px;list-style:none;padding:0;margin:28px 0 26px;counter-reset:s}
.stepper li{flex:1;counter-increment:s;font-size:14px;color:var(--muted2);padding:10px 0 0;border-top:3px solid var(--line)}
.stepper li::before{content:counter(s) ". "}
.stepper li.on{color:var(--ink);font-weight:600;border-top-color:var(--blue)}
.stepper li.done{color:var(--muted);border-top-color:var(--ink)}
.panel h2{font-size:22px;margin:0 0 18px}
.sess{background:var(--soft);border-radius:11px;padding:14px 16px;margin:0}
.done-box{text-align:center;padding:24px 0}
.done-box img{width:84px;height:84px}
.done-box p{color:var(--muted)}
.mine{margin:44px 0 0;padding:22px 0 0;border-top:1px solid var(--line)}
.mine h3{font-size:16px;margin:0 0 10px}
.mine ul{list-style:none;padding:0;margin:0}
.mine li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:15px}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:980px;border:1px solid currentColor;white-space:nowrap}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.mute{color:var(--muted2)}

/* 관리 */
.ah{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 0 12px;margin:0 0 18px}
.tabs button{min-height:34px;padding:0 14px;border-radius:980px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.abar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.abar p{margin:0}
.alist{list-style:none;padding:0;margin:0}
.alist li{display:flex;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.alist .ai{flex:1 1 320px;min-width:0}
.alist .ai b{font-size:17px}
.alist .ai span{display:block;font-size:13px;color:var(--muted);margin:3px 0 0}
.alist .ai p{margin:6px 0 0;font-size:15px}
.alist .ab{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sform{background:var(--soft);border-radius:18px;padding:20px;margin:0 0 20px}
.grid4{display:grid;grid-template-columns:150px 1fr 190px 110px;gap:12px}
.grid4 .field{margin:0 0 14px}
.bigpin{font-size:64px;font-weight:600;letter-spacing:.08em;margin:6px 0 0}

/* 모달·알림 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:90;padding:16px}
.modal .box{position:relative;background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:28px 24px 24px;text-align:center}
.modal .box.wide{max-width:1100px;text-align:left}
.modal .box h3{font-size:22px;margin:0 0 8px;letter-spacing:-.02em}
.modal .x{position:absolute;top:10px;right:12px;width:36px;height:36px;border:0;background:var(--soft);border-radius:50%;font-size:20px;cursor:pointer;line-height:1}
.qrbox{width:260px;max-width:100%;margin:14px auto}
.qrbox svg{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;z-index:100;max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad)}

@media (max-width:760px){
  .grid4{grid-template-columns:1fr 1fr}
  .steps3{grid-template-columns:1fr}
  .hero{padding:56px 18px 48px}
  .wrap{padding:0 16px}
  .nav .in{padding:0 16px;gap:12px}
  .nav .nl{display:none}
  .stage iframe{height:64vh}
}
@media (max-width:420px){ .grid4{grid-template-columns:1fr} .frow{flex-direction:column;align-items:stretch;gap:6px} .frow .fl{width:auto} }
@media (prefers-reduced-motion:reduce){ .card{transition:none} .card:hover{transform:none} }
</style>
</head>

async function rest(path, opt = {}) {

  if (!r.ok) {
    let m = '', code = '';
    try { const j = await r.json(); m = j.message || j.hint || ''; code = j.code || ''; } catch (e) {}
    const err = new Error(m || ('서버 응답 ' + r.status)); err.status = r.status; err.code = code; throw err;
  }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

        <input type="text" id="cname" maxlength="20" placeholder="이름 (비워 두셔도 됩니다)" aria-label="이름" value="${esc(load('gth:cname', ''))}">
        <textarea id="cbody" maxlength="300" rows="3" placeholder="써 보신 느낌, 고쳐 쓴 방법, 궁금한 점을 남겨 주세요." aria-label="의견" required></textarea>
        <div class="frow2"><span class="hint" id="ccount">0 / 300</span><button class="btn primary sm" type="submit">의견 남기기</button></div>
      </form>
    </section>
    <details class="own"><summary>이 앱을 올린 선생님이신가요?</summary><div id="ownbox"></div></details>
  </div>`;
  let html = null;
  view.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, stage = $('#stage');
    if (act === 'pc' || act === 'phone') { stage.classList.toggle('phone', act === 'phone'); $$('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }
    if (act === 'dl') { if (html) download(a.title, html); else toast('아직 앱을 불러오는 중입니다.', true); }
    if (act === 'qr') modal(`<h3>휴대폰으로 열기</h3><p class="hint">카메라로 비추면 이 앱이 휴대폰에서 바로 열립니다.</p><div class="qrbox">${qrSvg(runUrl)}</div><p class="mono">${esc(runUrl)}</p>`);
  };
  view.oninput = e => { if (e.target.id === 'cbody') $('#ccount').textContent = e.target.value.length + ' / 300'; };
  $('#cform').onsubmit = async e => {
    e.preventDefault();
    const body = $('#cbody').value.trim(), name = $('#cname').value.trim(), btn = $('#cform button');
    if (!body) return;
    btn.disabled = true;
    try { await API.comment(a.id, name, body); store('gth:cname', name); $('#cbody').value = ''; $('#ccount').textContent = '0 / 300'; await loadComments(a.id); toast('의견을 남겼습니다. 고맙습니다!'); }
    catch (err) { toast(err.message, true); }
    finally { btn.disabled = false; }
  };
  loadComments(a.id);
  try { html = await API.html(a.id); } catch (e) {}
  if (S.page !== 'app') return;
  if (html) runIn($('#stage'), html, a.title); else $('#stage').innerHTML = `<p class="empty">앱을 불러오지 못했습니다.</p>`;
  ownerBox(a);
}
async function loadComments(id) {
  const ul = $('#clist'); if (!ul) return;
  try {
    const cs = await API.comments(id);
    $('#cn').textContent = cs.length || '';
    ul.innerHTML = cs.length ? cs.map(c => `<li><p class="ch"><b>${esc(c.author || '이름 없는 선생님')}</b><span>${ago(c.created_at)}</span></p><p class="cb">${esc(c.body)}</p></li>`).join('')
      : `<li class="empty">아직 의견이 없습니다. 첫 의견을 남겨 주세요.</li>`;
    S.counts[id] = cs.length;
  } catch (e) { ul.innerHTML = `<li class="empty">의견을 불러오지 못했습니다.</li>`; }
}
function ownerBox(a) {
  const box = $('#ownbox'); if (!box) return;
  box.innerHTML = `<p class="hint">올릴 때 정한 고치기 비밀번호로 내용을 고치거나 앱을 내릴 수 있습니다. HTML 파일을 바꾸면 확인을 거쳐 다시 공개됩니다.</p>
    <div class="field"><label for="opw">고치기 비밀번호</label><input type="password" id="opw" autocomplete="off"></div>
    <div class="field"><label for="otitle">제목</label><input type="text" id="otitle" maxlength="60" value="${esc(a.title)}"></div>
    <div class="field"><label for="osum">한 줄 소개</label><input type="text" id="osum" maxlength="140" value="${esc(a.summary)}"></div>
    <div class="field"><label for="odep">배포 주소</label><input type="url" id="odep" placeholder="https://" value="${esc(a.deploy_url || '')}"></div>
    <div class="field"><span class="lb">HTML 파일 바꾸기 (선택)</span><label class="drop sm"><input type="file" id="ofile" accept=".html,.htm,text/html" hidden><span id="ofname">고친 HTML 파일을 고르세요</span></label></div>
    <div class="frow2"><button class="btn line sm danger" type="button" data-own="rm">이 앱 내리기</button><button class="btn primary sm" type="button" data-own="save">고친 내용 저장</button></div>`;
  let newHtml = null;
  $('#ofile').onchange = async e => { const f = e.target.files[0]; if (!f) return; const r = await readHtmlFile(f); if (r.err) { toast(r.err, true); return; } newHtml = r.html; $('#ofname').textContent = f.name + ' · ' + kb(r.size); };
  box.onclick = async e => {
    const b = e.target.closest('[data-own]'); if (!b) return;
    const pw = $('#opw').value;
    if (pw.length < 4) { toast('고치기 비밀번호를 넣어 주세요.', true); $('#opw').focus(); return; }
    if (b.dataset.own === 'rm') {
      if (!confirm('이 앱을 목록에서 내릴까요?')) return;
      try { await API.remove(a.id, pw); S.loaded = false; toast('앱을 내렸습니다.'); location.hash = '#/'; } catch (err) { toast(err.message, true); }
      return;
    }
    const dep = $('#odep').value.trim();
    if (dep && !isHttps(dep)) { toast('배포 주소는 https:// 로 시작해야 합니다.', true); return; }
    b.disabled = true;
    try {
      const st = await API.update({ p_id: a.id, p_editpass: pw, p_title: $('#otitle').value.trim(), p_summary: $('#osum').value.trim(), p_author: null,
        p_level: null, p_subject: null, p_purpose: null, p_html: newHtml, p_thumb: null, p_deploy: dep });
      S.loaded = false;
      if (st === 'pending') { toast('저장했습니다. 바꾼 파일은 확인을 거쳐 다시 공개됩니다.'); location.hash = '#/'; }
      else { toast('저장했습니다.'); viewDetail(a.id); }
    } catch (err) { toast(err.message, true); } finally { b.disabled = false; }
  };
}

/* ════════ 3. 올리기 ════════ */
function viewUpload() {
  document.title = '앱 올리기 · GiteacherHub';
  const U = { code: (QS.get('s') || '').toLowerCase(), pin: '', html: '', name: '', thumb: '', level: '', purpose: '' };
  view.innerHTML = `<div class="wrap pad narrow up">
    <a class="back" href="#/">‹ 목록</a>
    <p class="eyebrow">앱 올리기</p>
    <h1>만든 앱을 올려 주세요</h1>
    <p class="lead">HTML 파일 한 장이면 됩니다. GitHub 계정이 없어도 올릴 수 있습니다.</p>
    <ol class="stepper"><li class="on">회차 확인</li><li>앱 정보</li><li>올리기 끝</li></ol>
    <section class="panel" id="st1"><p class="empty">불러오는 중입니다…</p></section>
    <section class="panel" id="st2" hidden></section>
    <section class="panel" id="st3" hidden></section>
    <div id="mine"></div>
  </div>`;
  const stepTo = n => {
    [1, 2, 3].forEach(i => { $('#st' + i).hidden = i !== n; });
    $$('.stepper li').forEach((li, i) => { li.className = i + 1 === n ? 'on' : i + 1 < n ? 'done' : ''; });
    scrollTo(0, 0);
  };
  loadAll().then(() => { if (S.page === 'up') { renderStep1(); renderMine(); } }).catch(e => { $('#st1').innerHTML = `<p class="empty">회차를 불러오지 못했습니다. (${esc(e.message)})</p>`; });

  function renderStep1() {
    const st = $('#st1');
    if (S.notReady) { st.innerHTML = `<div class="notice"><b>보관함을 준비하고 있습니다.</b><p>조금 뒤에 다시 열어 주세요.</p></div>`; return; }
    const open = S.sessions.filter(s => s.open), fixed = open.find(s => s.code === U.code);
    if (!open.length) { st.innerHTML = `<div class="notice"><b>지금은 올리기를 받는 회차가 없습니다.</b><p>연수 중에 안내받은 주소로 다시 들어와 주세요.</p></div>`; return; }
    st.innerHTML = `<h2>1. 연수 회차와 PIN</h2>
      <div class="field">${fixed
        ? `<span class="lb">회차</span><p class="sess"><b>${esc(fixed.name)}</b> · ${esc(fmtDay(fixed.held_on))}</p>`
        : `<label for="sess">회차</label><select id="sess"><option value="">고르세요</option>${open.map(s => `<option value="${esc(s.code)}">${esc(fmtDay(s.held_on) + ' · ' + s.name)}</option>`).join('')}</select>`}</div>
      <div class="field"><label for="pin">PIN</label><input type="text" id="pin" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="연수에서 안내받은 숫자"></div>
      <button class="btn primary" id="go1">확인</button>`;
    const go = async () => {
      const code = fixed ? fixed.code : $('#sess').value, pin = $('#pin').value.trim();
      if (!code) { toast('회차를 골라 주세요.', true); return; }
      if (!/^[0-9]{4,8}$/.test(pin)) { toast('PIN은 숫자 4~8자리입니다.', true); $('#pin').focus(); return; }
      $('#go1').disabled = true;
      try { if (await API.pinOk(code, pin)) { U.code = code; U.pin = pin; renderStep2(); stepTo(2); } else toast('PIN이 맞지 않습니다. 연수 화면의 숫자를 다시 확인해 주세요.', true); }
      catch (e) { toast(e.message, true); } finally { $('#go1').disabled = false; }
    };
    $('#go1').onclick = go; $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  function renderStep2() {
    const st = $('#st2');
    st.innerHTML = `<h2>2. 앱 정보</h2>
      <div class="field"><span class="lb">HTML 파일 <em>*</em></span>
        <div class="tabs2" role="group" aria-label="올리는 방법"><button type="button" data-src="file" aria-pressed="true">파일 올리기</button><button type="button" data-src="paste" aria-pressed="false">코드 붙여넣기</button></div>
        <label class="drop" id="hdrop"><input type="file" id="hfile" accept=".html,.htm,text/html" hidden><b id="hmsg">HTML 파일을 끌어다 놓거나 눌러서 고르세요</b><span class="hint">한 파일, 2MB 이하</span></label>
        <div id="pastebox" hidden><textarea id="hpaste" class="code" placeholder="AI가 준 코드를 통째로 붙여넣으세요. 설명 문장이 섞여 있어도 코드 부분만 골라냅니다."></textarea>
          <p style="margin:10px 0 0"><button class="btn line sm" type="button" id="usepaste">이 코드로 미리보기</button></p></div>
      </div>
      <div class="stage small" id="upstage" hidden></div>
      <p class="hint" id="uphint" hidden>위 화면이 선생님 앱이 목록에서 보일 모습입니다. 버튼을 눌러 잘 움직이는지 확인해 주세요.</p>
      <div class="field" style="margin-top:20px"><label for="ttl">제목 <em>*</em></label><input type="text" id="ttl" maxlength="60"></div>
      <div class="field"><label for="sum">한 줄 소개</label><input type="text" id="sum" maxlength="140" placeholder="어떤 수업·업무에 쓰는 앱인지 한 문장으로"></div>
      <div class="field"><label for="au">만든 선생님</label><input type="text" id="au" maxlength="30" placeholder="이름이나 별칭 (비워 두셔도 됩니다)"></div>
      <div class="field"><span class="lb">학교급 <em>*</em></span><div class="chips wrapit" data-pick="level">${LEVELS.map(v => `<button type="button" class="chip" data-v="${v}" aria-pressed="false">${v}</button>`).join('')}</div></div>
      <div class="field"><label for="sj">과목 <em>*</em></label><select id="sj"><option value="">고르세요</option>${SUBJECTS.map(v => `<option>${v}</option>`).join('')}</select></div>
      <div class="field"><span class="lb">목적 <em>*</em></span><div class="chips wrapit" data-pick="purpose">${PURPOSES.map(v => `<button type="button" class="chip" data-v="${v}" aria-pressed="false">${v}</button>`).join('')}</div></div>
      <div class="field"><span class="lb">대표 화면 (선택)</span>
        <div class="drop" id="tdrop" tabindex="0" role="button" aria-label="대표 화면 넣기"><input type="file" id="tfile" accept="image/*" hidden><span id="tmsg">앱 화면을 캡처(Windows는 Win+Shift+S)한 뒤 이 칸을 누르고 Ctrl+V 하세요. 이미지 파일을 골라도 됩니다.</span><img id="timg" alt="대표 화면" hidden></div>
        <p style="margin:6px 0 0"><button class="btn sm" type="button" id="tclear" hidden>대표 화면 지우기</button></p>
        <span class="hint">목록에서 앱을 알아보기 쉬워집니다. 학생 이름이 보이지 않는 화면으로 골라 주세요.</span></div>
      <div class="field"><label for="dep">배포 주소 (선택)</label><input type="url" id="dep" placeholder="https://아이디.github.io/…"><span class="hint">GitHub Pages 등에 올려 두셨다면 적어 주세요. 상세 화면에 「배포 주소」 버튼이 생깁니다.</span></div>
      <div class="field"><label for="epw">고치기 비밀번호 <em>*</em></label><input type="password" id="epw" autocomplete="new-password" minlength="4"><span class="hint">나중에 파일을 바꾸거나 앱을 내릴 때 씁니다. 4자 이상으로 정해 주세요.</span></div>
      <label class="check"><input type="checkbox" id="agree"><span>학생 실명·사진·연락처가 들어 있지 않습니다. <em>*</em></span></label>
      <div class="frow2"><button class="btn" type="button" id="back1">‹ 회차 다시 고르기</button><button class="btn primary" type="button" id="go2">올리기</button></div>`;

    const setHtml = (html, label) => {
      const size = bytes(html);
      if (size > MAX_HTML) { toast('2MB보다 큽니다. 넣은 이미지를 줄이거나 빼 주세요.', true); return; }
      U.html = html; U.name = label;
      $('#hdrop').classList.add('ok'); $('#hmsg').textContent = label + ' · ' + kb(size);
      const stg = $('#upstage'); stg.hidden = false; $('#uphint').hidden = false; runIn(stg, html, '올릴 앱 미리보기');
      const t = /<title[^>]*>([^<]{1,80})<\/title>/i.exec(html);
      if (t && !$('#ttl').value.trim()) $('#ttl').value = t[1].trim().slice(0, 60);
    };
    const takeFile = async f => { if (!f) return; const r = await readHtmlFile(f); if (r.err) { toast(r.err, true); return; } setHtml(r.html, f.name); };
    const setThumb = async blob => {
      if (!blob || !/^image\//.test(blob.type)) return;
      const d = await imageToThumb(blob).catch(() => null);
      if (!d) { toast('이미지를 줄이지 못했습니다. 다른 캡처로 해 보세요.', true); return; }
      U.thumb = d; $('#timg').src = d; $('#timg').hidden = false; $('#tmsg').hidden = true; $('#tclear').hidden = false; $('#tdrop').classList.add('ok');
    };

    $('#hfile').onchange = e => takeFile(e.target.files[0]);
    const hd = $('#hdrop');
    hd.ondragover = e => { e.preventDefault(); hd.classList.add('on'); };
    hd.ondragleave = () => hd.classList.remove('on');
    hd.ondrop = e => { e.preventDefault(); hd.classList.remove('on'); takeFile(e.dataTransfer.files[0]); };
    $('#usepaste').onclick = () => { const h = extractHtml($('#hpaste').value); if (!h) { toast('HTML 코드를 찾지 못했습니다. <!DOCTYPE html> 부터 </html> 까지 들어 있는지 확인해 주세요.', true); return; } setHtml(h, '붙여넣은 코드'); };
    st.querySelector('.tabs2').onclick = e => {
      const b = e.target.closest('[data-src]'); if (!b) return;
      $$('.tabs2 button', st).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      const paste = b.dataset.src === 'paste'; $('#pastebox').hidden = !paste; hd.hidden = paste;
    };
    st.onclick = e => {
      const c = e.target.closest('[data-pick] .chip'); if (!c) return;
      const key = c.parentElement.dataset.pick; U[key] = c.dataset.v;
      $$('.chip', c.parentElement).forEach(x => x.setAttribute('aria-pressed', String(x === c)));
    };
    const td = $('#tdrop');
    td.onclick = () => { if (U.thumb) return; $('#tfile').click(); };
    td.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#tfile').click(); } };
    td.ondragover = e => { e.preventDefault(); td.classList.add('on'); };
    td.ondragleave = () => td.classList.remove('on');
    td.ondrop = e => { e.preventDefault(); td.classList.remove('on'); setThumb(e.dataTransfer.files[0]); };
    $('#tfile').onchange = e => setThumb(e.target.files[0]);
    $('#tclear').onclick = () => { U.thumb = ''; $('#timg').hidden = true; $('#tmsg').hidden = false; $('#tclear').hidden = true; td.classList.remove('ok'); $('#tfile').value = ''; };
    st.onpaste = e => {
      const it = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/'));
      if (it) { e.preventDefault(); setThumb(it.getAsFile()); }
    };
    $('#back1').onclick = () => stepTo(1);
    $('#go2').onclick = async () => {
      const title = $('#ttl').value.trim(), subject = $('#sj').value, dep = $('#dep').value.trim(), pw = $('#epw').value;
      const miss = !U.html ? 'HTML 파일을 올려 주세요.' : !title ? '제목을 적어 주세요.' : !U.level ? '학교급을 골라 주세요.' : !subject ? '과목을 골라 주세요.'
        : !U.purpose ? '목적을 골라 주세요.' : (dep && !isHttps(dep)) ? '배포 주소는 https:// 로 시작해야 합니다.' : pw.length < 4 ? '고치기 비밀번호를 4자 이상으로 정해 주세요.'
        : !$('#agree').checked ? '학생 개인정보가 없는지 확인하고 체크해 주세요.' : '';
      if (miss) { toast(miss, true); return; }
      const btn = $('#go2'); btn.disabled = true; btn.textContent = '올리는 중…';
      try {
        const id = await API.submit({ p_code: U.code, p_pin: U.pin, p_title: title, p_summary: $('#sum').value.trim(), p_author: $('#au').value.trim(),
          p_level: U.level, p_subject: subject, p_purpose: U.purpose, p_html: U.html, p_thumb: U.thumb || '', p_deploy: dep, p_editpass: pw });
        const mine = load('gth:mine', []); mine.unshift({ id, title, at: new Date().toISOString() }); store('gth:mine', mine.slice(0, 30));
        S.loaded = false; renderStep3(title); stepTo(3); renderMine();
      } catch (e) { toast(e.message, true); }
      finally { btn.disabled = false; btn.textContent = '올리기'; }
    };
  }

  function renderStep3(title) {
    $('#st3').innerHTML = `<div class="done-box"><img src="icon.svg" alt=""><h2>올렸습니다!</h2>
      <p>「${esc(title)}」은 확인을 거친 뒤 목록에 올라옵니다.<br>연수 중이라면 곧 보입니다.</p>
      <div class="frow2 center"><a class="btn line" href="#/${U.code ? '?' : ''}" id="tolist">목록으로</a><button class="btn primary" type="button" id="again">하나 더 올리기</button></div></div>`;
    $('#tolist').onclick = e => { e.preventDefault(); S.f.s = U.code; location.hash = '#/'; };
    $('#again').onclick = () => { U.html = ''; U.thumb = ''; U.level = ''; U.purpose = ''; renderStep2(); stepTo(2); };
  }

  async function renderMine() {
    const mine = load('gth:mine', []); const box = $('#mine'); if (!box || !mine.length) return;
    if (!S.loaded) { try { await loadAll(); } catch (e) {} }
    box.innerHTML = `<section class="mine"><h3>이 기기에서 올린 앱</h3><ul>${mine.map(m => {
      const pub = S.apps.some(a => a.id === m.id);
      return `<li><span>${pub ? `<a href="#/app/${m.id}">${esc(m.title)}</a>` : esc(m.title)}</span>${pub ? '<span class="badge ok">공개</span>' : '<span class="badge warn">확인 중</span>'}</li>`;
    }).join('')}</ul></section>`;
  }
}

/* ════════ 4. 관리 ════════ */
function viewAdmin() {
  document.title = '관리 · GiteacherHub';
  const pass = sget('gth:ap');
  if (!pass) {
    view.innerHTML = `<div class="wrap pad narrow"><a class="back" href="#/">‹ 목록</a><h1>관리</h1>
      <div class="field" style="margin-top:24px;max-width:360px"><label for="apw">관리자 비밀번호</label><input type="password" id="apw" autocomplete="current-password"></div>
      <button class="btn primary" id="alog">들어가기</button></div>`;
    const go = async () => {
      const p = $('#apw').value; if (!p) return;
      try { if (await API.isAdmin(p)) { sset('gth:ap', p); viewAdmin(); } else toast('비밀번호가 맞지 않습니다.', true); } catch (e) { toast(e.message, true); }
    };
    $('#alog').onclick = go; $('#apw').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#apw').focus();
    return;
  }
  const A = { apps: [], sessions: [], comments: [] };
  view.innerHTML = `<div class="wrap pad">
    <div class="ah"><h1>관리</h1><button class="btn sm" id="alogout">나가기</button></div>
    <div class="tabs" id="atabs">${[['pending', '확인 대기'], ['public', '공개 중'], ['hidden', '내린 앱'], ['sessions', '회차'], ['comments', '의견'], ['pass', '비밀번호']]
      .map(([k, t]) => `<button data-tab="${k}" aria-pressed="${S.tab === k}">${t}<span class="n" data-count="${k}"></span></button>`).join('')}</div>
    <div id="apanel"><p class="empty">불러오는 중입니다…</p></div></div>`;
  $('#alogout').onclick = () => { sset('gth:ap', ''); location.hash = '#/'; };
  $('#atabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; S.tab = b.dataset.tab; $$('#atabs button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); draw(); };
  const fail = e => { if (/비밀번호/.test(e.message)) { sset('gth:ap', ''); toast('다시 들어와 주세요.', true); viewAdmin(); } else toast(e.message, true); };
  async function refresh() {
    try { [A.apps, A.sessions] = await Promise.all([API.aApps(pass), API.aSessions(pass)]); }
    catch (e) { fail(e); return; }
    const c = st => A.apps.filter(a => a.status === st).length;
    $('[data-count="pending"]').textContent = c('pending') ? ' ' + c('pending') : '';
    draw();
  }
  const sName = id => { const s = A.sessions.find(x => x.id === id); return s ? fmtDay(s.held_on) + ' ' + s.name : ''; };
  function appRow(a) {
    const btns = a.status === 'pending' ? `<button class="btn line sm" data-a="pv" data-id="${a.id}">미리보기</button><button class="btn primary sm" data-a="st" data-st="public" data-id="${a.id}">공개</button><button class="btn sm danger" data-a="st" data-st="hidden" data-id="${a.id}">내리기</button>`
      : a.status === 'public' ? `<a class="btn line sm" href="#/app/${a.id}">열기</a><button class="btn sm danger" data-a="st" data-st="hidden" data-id="${a.id}">내리기</button>`
      : `<button class="btn line sm" data-a="pv" data-id="${a.id}">미리보기</button><button class="btn primary sm" data-a="st" data-st="public" data-id="${a.id}">다시 공개</button><button class="btn sm danger" data-a="purge" data-id="${a.id}">완전 삭제</button>`;
    return `<li><div class="ai"><b>${esc(a.title)}</b><span>${esc(a.author || '이름 없는 선생님')} · ${esc(sName(a.session_id))} · ${esc(a.level)} · ${esc(a.subject)} · ${esc(a.purpose)} · ${kb(a.bytes)} · ${ago(a.updated_at)}${a.has_thumb ? ' · 대표 화면 있음' : ''}${a.deploy_url ? ' · 배포 주소 있음' : ''}</span>${a.summary ? `<p>${esc(a.summary)}</p>` : ''}</div><div class="ab">${btns}</div></li>`;
  }
  function draw() {
    const P = $('#apanel');
    if (['pending', 'public', 'hidden'].includes(S.tab)) {
      const list = A.apps.filter(a => a.status === S.tab);
      const head = S.tab === 'pending'
        ? `<div class="abar"><p>확인을 기다리는 앱 <b>${list.length}</b>개. 미리보기로 학생 이름이 없는지 보고 공개해 주세요.</p>${list.length ? `<button class="btn primary sm" data-a="all">모두 공개</button>` : ''}</div>`
        : `<div class="abar"><p>${S.tab === 'public' ? '공개 중인' : '내린'} 앱 <b>${list.length}</b>개</p></div>`;
      P.innerHTML = head + (list.length ? `<ul class="alist">${list.map(appRow).join('')}</ul>` : `<p class="empty">없습니다.</p>`);
    } else if (S.tab === 'sessions') drawSessions(P);
    else if (S.tab === 'comments') drawComments(P);
    else drawPass(P);
  }
  function drawSessions(P) {
    const d = today(), rnd = () => Array.from({ length: 3 }, () => 'abcdefghjkmnpqrstuvwxyz'[Math.floor(Math.random() * 23)]).join('');
    P.innerHTML = `<form class="sform" id="sform"><h2 style="font-size:20px">회차 만들기</h2>
      <div class="grid4">
        <div class="field"><label for="sd">날짜</label><input type="date" id="sd" value="${d}"></div>
        <div class="field"><label for="sn">이름</label><input type="text" id="sn" maxlength="60" placeholder="예: ○○중 바이브코딩 연수"></div>
        <div class="field"><label for="sc">코드</label><input type="text" id="sc" maxlength="40" value="${d}-${rnd()}"></div>
        <div class="field"><label for="sp">PIN</label><input type="text" id="sp" inputmode="numeric" maxlength="8" value="${String(Math.floor(1000 + Math.random() * 9000))}"></div>
      </div>
      <div class="frow2"><span class="hint">코드는 올리기 주소에 들어갑니다(영어 소문자·숫자·-). 같은 코드를 넣으면 이름·날짜·PIN을 고칩니다.</span><button class="btn primary sm">저장</button></div></form>
      <ul class="alist">${A.sessions.map(s => `<li><div class="ai"><b>${esc(s.name)}</b><span>${esc(fmtDay(s.held_on))} · 코드 ${esc(s.code)} · PIN ${esc(s.pin)} · 앱 ${s.apps}개${s.pending ? ` (확인 대기 ${s.pending})` : ''}</span></div>
        <div class="ab"><button class="btn sm ${s.open ? 'primary' : 'line'}" data-a="sopen" data-id="${s.id}" data-open="${s.open ? 0 : 1}">${s.open ? '올리기 받는 중' : '올리기 닫힘'}</button>
        <button class="btn line sm" data-a="sguide" data-id="${s.id}">올리기 안내 띄우기</button>
        <button class="btn line sm" data-a="slink" data-id="${s.id}">모음 주소 복사</button>
        ${s.apps ? '' : `<button class="btn sm danger" data-a="sdel" data-id="${s.id}">지우기</button>`}</div></li>`).join('') || '<li class="empty">아직 회차가 없습니다.</li>'}</ul>`;
    $('#sd').onchange = e => { const c = $('#sc'); if (/^\d{4}-\d{2}-\d{2}-/.test(c.value)) c.value = e.target.value + c.value.slice(10); };
    $('#sform').onsubmit = async e => {
      e.preventDefault();
      const s = { held_on: $('#sd').value, name: $('#sn').value.trim(), code: $('#sc').value.trim().toLowerCase(), pin: $('#sp').value.trim() };
      if (!s.name) { toast('회차 이름을 적어 주세요.', true); return; }
      if (!/^[a-z0-9-]{3,40}$/.test(s.code)) { toast('코드는 영어 소문자·숫자·- 로 3~40자입니다.', true); return; }
      if (s.pin && !/^[0-9]{4,8}$/.test(s.pin)) { toast('PIN은 숫자 4~8자리입니다.', true); return; }
      try { await API.aSessionSave(pass, s); toast('저장했습니다.'); await refresh(); const made = A.sessions.find(x => x.code === s.code); if (made) guide(made); } catch (err) { fail(err); }
    };
  }
  const upUrl = s => new URL('?s=' + encodeURIComponent(s.code) + '#/up', location.href.split('#')[0].split('?')[0]).href;
  const listUrl = s => new URL('?s=' + encodeURIComponent(s.code), location.href.split('#')[0].split('?')[0]).href;
  function guide(s) {
    modal(`<p class="eyebrow">${esc(fmtDay(s.held_on) + ' · ' + s.name)}</p><h3>만든 앱을 올려 주세요</h3>
      <div class="qrbox">${qrSvg(upUrl(s))}</div><p class="mono">${esc(upUrl(s))}</p>
      <p class="hint" style="margin:14px 0 0">PIN</p><p class="bigpin">${esc(s.pin)}</p>`);
  }
  async function drawComments(P) {
    P.innerHTML = `<p class="empty">불러오는 중입니다…</p>`;
    try { A.comments = await API.aComments(pass); } catch (e) { fail(e); return; }
    P.innerHTML = A.comments.length ? `<ul class="alist">${A.comments.map(c => `<li><div class="ai"><b>${esc(c.author || '이름 없는 선생님')}</b><span>「${esc(c.app_title)}」 · ${ago(c.created_at)}${c.hidden ? ' · 숨김' : ''}</span><p>${esc(c.body)}</p></div>
      <div class="ab"><a class="btn line sm" href="#/app/${c.app_id}">앱 열기</a><button class="btn sm ${c.hidden ? 'line' : 'danger'}" data-a="chide" data-id="${c.id}" data-h="${c.hidden ? 0 : 1}">${c.hidden ? '다시 보이기' : '숨기기'}</button></div></li>`).join('')}</ul>` : `<p class="empty">의견이 없습니다.</p>`;
  }
  function drawPass(P) {
    P.innerHTML = `<div style="max-width:380px"><div class="field"><label for="op">지금 비밀번호</label><input type="password" id="op"></div>
      <div class="field"><label for="np">새 비밀번호 (6자 이상)</label><input type="password" id="np" autocomplete="new-password"></div>
      <button class="btn primary" id="chg">바꾸기</button></div>`;
    $('#chg').onclick = async () => {
      try { await API.setPass($('#op').value, $('#np').value); sset('gth:ap', $('#np').value); toast('비밀번호를 바꿨습니다.'); viewAdmin(); } catch (e) { toast(e.message, true); }
    };
  }
  view.onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const act = b.dataset.a, id = b.dataset.id;
    try {
      if (act === 'st') { await API.aStatus(pass, [id], b.dataset.st); S.loaded = false; toast(b.dataset.st === 'public' ? '공개했습니다.' : '내렸습니다.'); await refresh(); }
      else if (act === 'all') { const ids = A.apps.filter(a => a.status === 'pending').map(a => a.id); if (!ids.length || !confirm(ids.length + '개를 모두 공개할까요?')) return; await API.aStatus(pass, ids, 'public'); S.loaded = false; toast('모두 공개했습니다.'); await refresh(); }
      else if (act === 'purge') { if (!confirm('완전히 지웁니다. 되돌릴 수 없습니다. 지울까요?')) return; await API.aPurge(pass, id); toast('지웠습니다.'); await refresh(); }
      else if (act === 'pv') {
        const a = A.apps.find(x => x.id === id), r = await API.aApp(pass, id);
        const m = modal(`<h3>${esc(a ? a.title : '')}</h3><p class="hint">${esc(a ? (a.author || '이름 없는 선생님') + ' · ' + sName(a.session_id) : '')}</p>${r && r.thumb ? `<p><img src="${esc(r.thumb)}" alt="대표 화면" style="max-width:320px;border-radius:11px;border:1px solid var(--line)"></p>` : ''}<div class="stage" id="pvstage" style="margin-top:12px"></div>`, true);
        if (r && r.html) runIn(m.box.querySelector('#pvstage'), r.html, '확인용 미리보기');
      }
      else if (act === 'sopen') { await API.aSessionOpen(pass, id, b.dataset.open === '1'); await refresh(); }
      else if (act === 'sguide') { const s = A.sessions.find(x => x.id === id); if (s) guide(s); }
      else if (act === 'slink') { const s = A.sessions.find(x => x.id === id); if (s) copyText(listUrl(s)); }
      else if (act === 'sdel') { if (!confirm('이 회차를 지울까요?')) return; await API.aSessionDel(pass, id); toast('지웠습니다.'); await refresh(); }
      else if (act === 'chide') { await API.aCommentHide(pass, id, b.dataset.h === '1'); drawComments($('#apanel')); }
    } catch (err) { fail(err); }
  };
  refresh();
}

route();
</script>
</body>
</html>
