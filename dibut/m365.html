<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M365 관리 센터 — 승급처리 · MFA 실습기</title>
<style>
:root{
  --brand:#0F6CBD; --brand-d:#0A5296; --brand-l:#EFF6FC; --brand-b:#B4D6F5;
  --bg:#F5F5F5; --card:#fff; --line:#E1DFDD; --line2:#EDEBE9;
  --tx:#242424; --tx2:#616161; --tx3:#8A8886;
  --ok:#107C10; --warn:#C19C00; --bad:#C50F1F; --purple:#5C2E91;
  --font:'Segoe UI','Pretendard','Malgun Gothic',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:Consolas,ui-monospace,monospace;font-size:.92em}
[hidden]{display:none !important}

.top{height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 8px 0 4px;gap:6px;flex:0 0 auto}
.waffle{width:44px;height:44px;border:0;background:none;color:var(--tx2);display:flex;align-items:center;justify-content:center;border-radius:4px}
.waffle:hover{background:#F3F2F1}
.top-title{font-size:15px;font-weight:600;letter-spacing:-.2px}
.top-sim{background:#FDE7E9;color:#A80000;font-weight:700;font-size:11px;padding:3px 9px;border-radius:3px;margin-left:4px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.top-btn{height:32px;padding:0 10px;border:0;background:none;color:var(--tx2);border-radius:4px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.top-btn:hover{background:#F3F2F1;color:var(--tx)}
.top-ava{width:28px;height:28px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}

.shell{display:flex;height:calc(100% - 48px)}
.nav{width:224px;flex:0 0 auto;background:#fff;border-right:1px solid var(--line);padding:10px 0;overflow:auto}
.nav-g{padding:9px 16px 5px;font-size:11.5px;color:var(--tx3);font-weight:600;letter-spacing:.3px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 16px;color:var(--tx);font-size:13.5px;border-left:3px solid transparent}
.nav a:hover{background:#F3F2F1;text-decoration:none}
.nav a.on{background:var(--brand-l);border-left-color:var(--brand);font-weight:600;color:var(--brand-d)}
.nav .ic{width:18px;display:flex;justify-content:center;color:var(--tx2)}
.nav a.on .ic{color:var(--brand)}
.nav .ext{margin:12px 12px 0;padding:11px 12px;background:#FFF8E6;border:1px solid #F0D48A;border-radius:5px;font-size:11.5px;line-height:1.65;color:#6B4E00}

.main{flex:1;overflow:auto;padding:22px 28px 40px}
h1.pt{margin:0 0 4px;font-size:24px;font-weight:600;letter-spacing:-.4px}
p.lead{color:var(--tx2);font-size:13.5px;margin:0 0 18px;line-height:1.75;max-width:940px}
.crumb{font-size:12.5px;color:var(--tx2);margin-bottom:8px}
.head-row{display:flex;align-items:flex-end;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.head-row .right{margin-left:auto}

.btn{height:32px;padding:0 14px;background:#fff;border:1px solid #8A8886;border-radius:3px;color:var(--tx);display:inline-flex;align-items:center;gap:7px;font-size:13.5px;white-space:nowrap}
.btn:hover{background:#F3F2F1}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.dgr{color:#A80000;border-color:#D69CA5}
.btn.dgr:hover{background:#FDF3F4}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.link{border:0;background:none;color:var(--brand);padding:0 4px;height:auto}
.btn.link:hover{background:none;text-decoration:underline}
.cmdbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.cmd{height:32px;padding:0 11px;border:0;background:none;border-radius:3px;display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--tx)}
.cmd:hover{background:#F3F2F1}
.cmd:disabled{opacity:.4;cursor:not-allowed}
.cmd .ic{color:var(--brand)}
.cmd:disabled .ic{color:var(--tx3)}
.cmdbar .sp{margin-left:auto}

.srch{display:flex;align-items:center;height:32px;border:1px solid #8A8886;border-radius:3px;background:#fff;padding:0 10px;gap:7px;min-width:250px}
.srch input{border:0;flex:1;height:100%;background:none}
.srch input:focus{outline:none}

.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.tbl thead th{text-align:left;padding:9px 12px;font-weight:600;font-size:12.5px;color:var(--tx2);border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
.tbl tbody td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tbody tr:hover{background:#F3F9FD}
.tbl tbody tr.sel{background:var(--brand-l)}
.tbl .c{text-align:center}
.tbl .empty td{text-align:center;color:var(--tx3);padding:40px 0}
.tblbox{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.scroll-x{overflow-x:auto}
.scroll-y{max-height:460px;overflow-y:auto}
.uname{font-weight:600;color:var(--brand-d)}
.uname:hover{text-decoration:underline;cursor:pointer}

.pill{display:inline-block;padding:2px 9px;border-radius:3px;font-size:11.5px;font-weight:600;line-height:1.65}
.pill.g{background:#DFF6DD;color:#0B5A0B}
.pill.y{background:#FFF4CE;color:#6B5300}
.pill.r{background:#FDE7E9;color:#A80000}
.pill.n{background:#F3F2F1;color:#605E5C}
.pill.b{background:var(--brand-l);color:var(--brand-d)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h3{margin:0 0 6px;font-size:16px;font-weight:600}
.card p{margin:0 0 14px;color:var(--tx2);font-size:13px;line-height:1.7}
.card .big{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1;margin-bottom:6px}
.card .sub{font-size:12.5px;color:var(--tx2)}
.card.acc{border-top:3px solid var(--brand)}
.card.acc2{border-top:3px solid var(--purple)}

.stat4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.st{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.st .k{font-size:12px;color:var(--tx2);margin-bottom:6px}
.st .v{font-size:24px;font-weight:700;letter-spacing:-.6px;line-height:1}
.st .v small{font-size:12px;font-weight:600;color:var(--tx2);margin-left:3px;letter-spacing:0}

.wz{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.wz-steps{display:flex;border-bottom:1px solid var(--line);background:#FAF9F8;overflow-x:auto}
.wz-step{flex:1;min-width:130px;padding:13px 12px;border:0;background:none;text-align:center;font-size:12.5px;color:var(--tx3);border-bottom:3px solid transparent;white-space:nowrap}
.wz-step.done{color:var(--tx2)}
.wz-step.on{color:var(--brand-d);font-weight:700;border-bottom-color:var(--brand);background:#fff}
.wz-body{padding:22px 24px;min-height:330px}
.wz-body h2{margin:0 0 6px;font-size:18px;font-weight:600}
.wz-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:8px;background:#FAF9F8}
.wz-foot .right{margin-left:auto;display:flex;gap:8px}

.field{margin-bottom:15px;max-width:520px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;height:32px;border:1px solid #8A8886;border-radius:3px;padding:0 10px;background:#fff}
.field textarea{height:150px;padding:8px 10px;resize:vertical;font-family:Consolas,ui-monospace,monospace;font-size:12.5px;line-height:1.7}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.opt{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:4px;margin-bottom:10px;cursor:pointer;background:#fff}
.opt:hover{background:#F3F9FD;border-color:var(--brand-b)}
.opt.on{border-color:var(--brand);background:var(--brand-l)}
.opt b{display:block;font-size:13.5px;margin-bottom:3px}
.opt span{font-size:12.5px;color:var(--tx2);line-height:1.6;display:block}

.note{border-radius:4px;padding:12px 14px;font-size:13px;line-height:1.7;margin-bottom:16px;border:1px solid}
.note.i{background:var(--brand-l);border-color:var(--brand-b);color:#0B4C87}
.note.w{background:#FFF8E6;border-color:#F0D48A;color:#6B4E00}
.note.d{background:#FDE7E9;border-color:#EFB6BD;color:#8E0710}
.note.g{background:#DFF6DD;border-color:#A6DDA3;color:#0B5A0B}
.note b{font-weight:700}

.diff{display:grid;grid-template-columns:1fr 40px 1fr;gap:0;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13px}
.diff:last-child{border-bottom:0}
.diff .a{color:var(--tx2)}
.diff .ar{text-align:center;color:var(--brand);font-weight:700}
.diff .b{font-weight:600}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:6px;width:min(580px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal.wide{width:min(900px,100%)}
.modal-h{padding:18px 22px 12px;display:flex;align-items:center;gap:10px}
.modal-h h3{margin:0;font-size:18px;font-weight:600}
.modal-h .x{margin-left:auto;background:none;border:0;color:var(--tx2);width:30px;height:30px;border-radius:3px}
.modal-h .x:hover{background:#F3F2F1}
.modal-b{padding:0 22px 18px;overflow:auto;font-size:13.5px;line-height:1.7}
.modal-f{padding:14px 22px;display:flex;gap:8px;justify-content:flex-start;border-top:1px solid var(--line2);flex-wrap:wrap}

.side{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:65;box-shadow:-4px 0 18px rgba(0,0,0,.18);display:flex;flex-direction:column}
.side-h{padding:18px 22px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2)}
.side-h h3{margin:0;font-size:17px;font-weight:600}
.side-h .x{margin-left:auto;background:none;border:0;color:var(--tx2);width:30px;height:30px;border-radius:3px}
.side-b{padding:18px 22px;overflow:auto;flex:1}
.side-f{padding:14px 22px;border-top:1px solid var(--line2);display:flex;gap:8px}
.kv{margin-bottom:15px}
.kv .k{font-size:12px;color:var(--tx2);margin-bottom:3px}
.kv .v{font-size:13.5px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);z-index:120;opacity:0;transition:.22s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast{background:#323130;color:#fff;padding:12px 20px;border-radius:4px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:min(600px,92vw)}
.toast.ok{background:#0B5A0B}
.toast.no{background:#A80000}

.fab{position:fixed;right:22px;bottom:22px;z-index:60;height:46px;padding:0 18px;border-radius:23px;background:var(--brand);border:0;color:#fff;box-shadow:0 6px 18px rgba(15,108,189,.4);display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px}
.fab:hover{background:var(--brand-d)}
.fab .bg{min-width:22px;height:22px;border-radius:11px;background:#fff;color:var(--brand-d);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.mp{position:fixed;right:22px;bottom:80px;z-index:61;width:min(400px,calc(100vw - 44px));max-height:min(620px,calc(100vh - 130px));background:#fff;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.mp-h{padding:16px 18px;background:var(--brand);color:#fff}
.mp-h h3{margin:0 0 3px;font-size:15px}
.mp-h p{margin:0;font-size:11.5px;color:#D6EAFB}
.mp-pr{height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin-top:10px;overflow:hidden}
.mp-pr i{display:block;height:100%;background:#8FE08F;transition:.3s}
.mp-b{overflow:auto;padding:4px 0}
.mi{display:flex;gap:11px;padding:13px 18px;border-bottom:1px solid var(--line2)}
.mi:last-child{border-bottom:0}
.mi .ck{width:20px;height:20px;border-radius:3px;border:1.6px solid #8A8886;flex:0 0 auto;display:flex;align-items:center;justify-content:center;margin-top:2px;color:transparent}
.mi.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.mi .t b{display:block;font-size:13px;margin-bottom:3px}
.mi.done .t b{color:var(--tx3);text-decoration:line-through}
.mi .t span{font-size:12px;color:var(--tx2);line-height:1.55;display:block}
.mp-f{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px}

@media(max-width:900px){
  /* 좁은 화면에서는 숨기지 말고 아이콘 레일로 줄인다 */
  .nav{width:48px}
  .nav .nlab,.nav .chev,.nav .nav-sec,.nav .nsub{display:none}
  .nav .nrow{justify-content:center;padding:0}
  .main{padding:16px 14px 40px}
  .diff{grid-template-columns:1fr 30px 1fr}
}

/* ═══════════════════════════════════════════════════════════
   실제 Microsoft 365 관리 센터 크롬 재현 (라이트 · 다크)
   ═══════════════════════════════════════════════════════════ */
:root{
  --suite:#252423; --suite-tx:#fff; --suite-hover:#3B3A39;
  --navbg:#fff; --navtx:#242424; --navhov:#F3F2F1; --navsel:#EDEBE9;
  --mainbg:#FAF9F8; --panel:#fff; --hair:#EDEBE9; --hair2:#E1DFDD;
  --txx:#242424; --txx2:#605E5C; --txx3:#8A8886; --acc:#2564CF;
}
html[data-theme="dark"]{
  --suite:#1B1A19; --suite-tx:#fff; --suite-hover:#323130;
  --navbg:#201F1E; --navtx:#F3F2F1; --navhov:#323130; --navsel:#3B3A39;
  --mainbg:#1B1A19; --panel:#252423; --hair:#3B3A39; --hair2:#484644;
  --txx:#F3F2F1; --txx2:#C8C6C4; --txx3:#A19F9D; --acc:#7CB0F2;
  --bg:#1B1A19; --card:#252423; --line:#3B3A39; --line2:#323130;
  --tx:#F3F2F1; --tx2:#C8C6C4; --tx3:#A19F9D; --brand:#7CB0F2; --brand-d:#A9C9F5; --brand-l:#252F3E; --brand-b:#3B4A5F;
}
html[data-theme="dark"] body{background:var(--mainbg);color:var(--txx)}
html[data-theme="dark"] .tblbox,html[data-theme="dark"] .card,html[data-theme="dark"] .st,
html[data-theme="dark"] .modal,html[data-theme="dark"] .side{background:var(--panel);border-color:var(--hair)}
html[data-theme="dark"] .tbl thead th{background:var(--panel);color:var(--txx2);border-color:var(--hair)}
html[data-theme="dark"] .tbl td{border-color:var(--line2)}
html[data-theme="dark"] .tbl tbody tr:hover{background:#323130}
html[data-theme="dark"] .btn{background:var(--panel);border-color:#605E5C;color:var(--txx)}
html[data-theme="dark"] .btn:hover{background:#3B3A39}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#323130;border-color:#605E5C;color:var(--txx)}
html[data-theme="dark"] .opt{background:var(--panel);border-color:var(--hair)}
html[data-theme="dark"] .srch{background:#323130;border-color:#605E5C}

body{background:var(--mainbg);color:var(--txx)}

/* ── 상단 스위트 바 ── */
.suite{height:48px;background:var(--suite);color:var(--suite-tx);display:flex;align-items:center;
  padding:0 4px;gap:2px;flex:0 0 auto;position:relative;z-index:30}
.suite .waf{width:48px;height:48px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center}
.suite .waf:hover{background:var(--suite-hover)}
.suite .brand{font-size:15px;font-weight:600;padding:0 10px 0 4px;white-space:nowrap;letter-spacing:-.2px}
.suite .simtag{background:#A4262C;color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap}
.suite-search{flex:1;max-width:600px;margin:0 auto;position:relative;display:flex;align-items:center}
.suite-search svg{position:absolute;left:11px;color:#605E5C;pointer-events:none}
.suite-search input{width:100%;height:32px;border:0;border-radius:4px;background:#fff;color:#242424;
  padding:0 12px 0 34px;font-size:13.5px}
.suite-search input::placeholder{color:#605E5C}
.suite-right{display:flex;align-items:center;gap:0;margin-left:auto}
.si{width:40px;height:40px;border:0;background:none;color:#fff;display:inline-flex;align-items:center;justify-content:center;border-radius:4px}
.si:hover{background:var(--suite-hover)}
.si.wide{width:auto;padding:0 10px;gap:6px;font-size:13px}
.suite-org{padding:0 12px;font-size:13px;color:#fff;white-space:nowrap;border-left:1px solid #484644;margin-left:6px;height:24px;display:flex;align-items:center}
.suite-ava{width:30px;height:30px;border-radius:50%;background:#8764B8;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;margin:0 6px}
@media(max-width:1080px){.suite .simtag,.suite-org{display:none}}
@media(max-width:760px){.suite-search{display:none}}

/* ── 좌측 탐색 ── */
.shell{display:flex;height:calc(100% - 48px)}
.nav{width:230px;flex:0 0 auto;background:var(--navbg);border-right:1px solid var(--hair);
  padding:6px 0 26px;overflow:auto;font-size:13.5px}
.nav.mini{width:48px}
.nav.mini .nlab,.nav.mini .chev,.nav.mini .nav-sec,.nav.mini .nsub{display:none}
.nav.mini .nrow{justify-content:center;padding:0}
.navtop{height:44px;display:flex;align-items:center;padding-left:2px}
.navtop .ham{width:44px;height:44px;border:0;background:none;color:var(--txx2);display:flex;align-items:center;justify-content:center;border-radius:4px}
.navtop .ham:hover{background:var(--navhov)}
.nav-sec{padding:14px 16px 6px;font-size:11.5px;font-weight:700;color:var(--txx3);letter-spacing:.2px;
  border-top:1px solid var(--hair);margin-top:8px}
.nrow{display:flex;align-items:center;gap:10px;height:34px;padding:0 12px 0 13px;color:var(--navtx);
  cursor:pointer;border-left:3px solid transparent;user-select:none}
.nrow:hover{background:var(--navhov)}
.nrow.on{background:var(--navsel);border-left-color:var(--acc);font-weight:600}
.nrow.dim{color:var(--txx3)}
.nrow .nic{width:18px;flex:none;display:flex;justify-content:center;color:var(--txx2)}
.nrow.on .nic{color:var(--acc)}
.nrow .nlab{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .chev{color:var(--txx3);transition:transform .15s}
.nrow.open .chev{transform:rotate(180deg)}
.nsub{padding:1px 0 4px}
.nsub .nrow{height:31px;padding-left:44px;font-size:13px}

/* ── 본문 ── */
.main{flex:1;overflow:auto;padding:18px 30px 46px;background:var(--mainbg)}
.crumb{font-size:12.5px;color:var(--txx2);margin:0 0 6px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.crumb a{color:var(--txx2)}
.crumb .sep{opacity:.6;display:inline-flex}
h1.pt{margin:0 0 4px;font-size:26px;font-weight:600;letter-spacing:-.5px;color:var(--txx)}
p.lead{color:var(--txx2)}

/* ── 명령 모음 ── */
.cmdbar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin:12px 0 10px;
  border-bottom:1px solid var(--hair);padding-bottom:8px}

/* 표시 이름 두 형식 — 학번형(CSV 일괄 생성분)과 학급형(클래스이음 학적 반영분) */
function nameOf(u){return u.name||String(u.disp||"").replace(/^\[[^\]]*\]/,"").replace(/^[0-9]+/,"");}
function fmtNum(u){return u.upn+nameOf(u);}
function fmtCls(u){return "["+u.grade+"학년 "+u.cls+"반]"+nameOf(u);}
function dispKind(u){return /^\[/.test(u.disp)?"학급형":(/^[0-9]/.test(u.disp)?"학번형":"이름만");}
function seed(){
  let s=20260830;
  const rnd=()=>((s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff);
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const out=[];let n=0;
  const mkDate=d=>{const t=new Date(2026,7,29-d);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");};
  [1,2,3].forEach(function(g){
    for(let i=1;i<=12;i++){
      const cls=Math.ceil(i/6),no=((i-1)%6)+1;
      const last=pick(SURNAME),first=pick(GIVEN),nm=last+first;
      const upn=stuUpn(g,cls,no);
      /* 2학년만 클래스이음으로 학적을 넣어 학급형 표시 이름 — 형식이 섞여 있는 실제 상황 재현 */
      out.push({id:"u"+(++n),last:last,first:first,name:nm,
        disp:g===2?("["+g+"학년 "+cls+"반]"+nm):(upn+nm),
        upn:upn,dom:DOMAIN,alias:[],quota:QUOTA_DEF,
        grade:g,cls:cls,no:no,group:GRP[g],license:LIC_S,role:"사용자",mfa:"사용 안 함",signIn:"허용",seen:mkDate(Math.floor(rnd()*20))});
    }
  });
  [["강현욱","hyunwook",DOM2],["김현정","hyunjung",DOMAIN],["조승재","seungjae",DOMAIN],
   ["이상민","sangmin",DOM2],["한지영","jiyoung",DOMAIN],["박서준","seojun",DOMAIN]].forEach(function(t){
    out.push({id:"u"+(++n),last:t[0].charAt(0),first:t[0].slice(1),name:t[0],disp:t[0],
      upn:t[1],dom:t[2],alias:[],quota:QUOTA_DEF,grade:0,cls:0,no:0,group:GRP[0],
      license:LIC_T,role:t[0]==="조승재"?"전역 관리자":"사용자",mfa:"사용 안 함",signIn:"허용",seen:mkDate(Math.floor(rnd()*4))});
  });
  /* 라이선스 없는 시스템 계정 — 실제 목록에도 섞여 있어 "학생만 골라내기"를 어렵게 만든다 */
  [["1학기 상담","G5975f5ca89d947bdaea95558d6162481"],
   ["1학기 학부모 상담 신청 페이지","G9d0175e0ebb54d20a627cb7993aa7885"],
   ["도서관 대출 신청","Ge5b6c8ce1d2c42c58e82bfca554ea33c"]].forEach(function(t){
    out.push({id:"u"+(++n),last:"",first:"",name:t[0],disp:t[0],upn:t[1],dom:DOMAIN,alias:[],quota:0,
      grade:9,cls:0,no:0,group:"(그룹 없음)",license:"",role:"사용자",mfa:"사용 안 함",signIn:"허용",seen:"-",sys:true});
  });
  return out;
}

function navOpenFor(page){
  for(let i=0;i<NAVTREE.length;i++){const g=NAVTREE[i];
    if(g.sub&&g.sub.some(s=>s.id===page))return i;}
  return -1;
}
function paintNav(){
  if(S.ui.navOpen==null)S.ui.navOpen=navOpenFor(S.ui.page);
  const row=function(o,idx,isSub){
    const on=o.id&&S.ui.page===o.id;
    const cls="nrow"+(on?" on":"")+(o.off?" dim":"")+(o.open?" open":"");
    const at=o.off?' data-nope="'+esc(o.n)+'"':(o.id?' data-go="'+o.id+'"':(o.grp!=null?' data-navg="'+o.grp+'"':""));
    return '<div class="'+cls+'"'+at+'>'
      +(isSub?"":'<span class="nic">'+(o.i||"")+"</span>")
      +'<span class="nlab">'+esc(o.n)+(o.tag?' <span class="pill y" style="font-size:10px">'+o.tag+"</span>":"")+"</span>"
      +(o.sub?'<span class="chev">'+CHEV+"</span>":"")+"</div>";
  };
  let h='<div class="navtop"><button class="ham" id="btnHam" title="탐색 메뉴 축소">'
    +'<svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/></svg></button></div>';
  NAVTREE.forEach(function(g,i){
    if(g.sec){h+='<div class="nav-sec">'+esc(g.sec)+"</div>";return;}
    const open=S.ui.navOpen===i;
    h+=row({n:g.n,i:g.i,id:g.sub?null:g.id,off:g.sub?0:g.off,sub:g.sub,open:open,grp:g.sub?i:null},i,false);
    if(g.sub&&open)h+='<div class="nsub">'+g.sub.map(s=>row(s,i,true)).join("")+"</div>";
  });
  $("#nav").innerHTML=h;
  $("#nav").classList.toggle("mini",!!S.ui.navMini);
}

function filt(){
  const q=(S.ui.q||"").trim().toLowerCase();
  return S.users.filter(function(u){
    if(S.ui.fg&&u.group!==S.ui.fg)return false;
    if(S.ui.fm&&u.mfa!==S.ui.fm)return false;
    if(S.ui.fl==="s"&&u.license!==LIC_S)return false;
    if(S.ui.fl==="t"&&u.license!==LIC_T)return false;
    if(S.ui.fl==="none"&&u.license)return false;
    if(S.ui.fs&&u.signIn!==S.ui.fs)return false;
    if(S.ui.fd&&(u.dom||DOMAIN)!==S.ui.fd)return false;
    if(q&&[u.disp,u.upn,addr(u),u.group,nameOf(u)].join(" ").toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}

function gradeFromId(id){
  let y=null;
  if(/^\d{9}$/.test(id))y=+id.slice(0,4);
  else if(/^\d{7}$/.test(id))y=2000+ +id.slice(0,2);
  if(y){const g=SCHOOLYEAR-y+1;return (g>=1&&g<=3)?g:1;}
  const g2=+String(id).charAt(0);return (g2>=1&&g2<=3)?g2:1;
}
function clsNoFromId(id){
  const t=String(id).slice(-4);
  return {cls:+t.slice(0,2)||0,no:+t.slice(2)||0};
}
function wzInit(){return {step:1,grad:"",csv:"",parsed:[],err:""};}
function parseCsv(t){
  const rows=[],err=[];
  const raw=String(t).replace(/\r/g,"");
  /* 실무 오류 1위 — 엑셀이 CSV로 저장할 때 붙이는 마지막 빈 줄 */
  if(raw.trim()&&/\n[ \t]*$/.test(raw))
    err.push("맨 아래에 빈 줄이 있습니다 — 관리 센터는 이것을 「내용 없는 사용자 1명」으로 읽어 업로드가 통째로 실패합니다. 메모장으로 열어 마지막 줄바꿈을 지우세요");
  raw.split("\n").forEach(function(ln,i){
    const s=ln.trim();if(!s)return;
    const c=s.split(",").map(x=>x.trim());
    if(i===0&&(c[0]==="사용자 이름"||c[0].toLowerCase()==="username"))return;
    if(c.length<4){err.push((i+1)+"행: 열이 4개가 아닙니다 (사용자 이름·이름·성·표시 이름)");return;}
    const id=c[0].split("@")[0];
    if(!/^\d{5}$|^\d{7}$|^\d{9}$/.test(id)){
      err.push((i+1)+"행: 사용자 이름은 학번 기반 숫자여야 합니다 (예: "+SCHOOLYEAR+"10101)");return;}
    rows.push({upn:id,first:c[1],last:c[2],disp:c[3]});
  });
  return {rows:rows,err:err};
}

     +(free-need<0?'<div class="note d" style="margin-top:16px">라이선스가 '+(need-free)+"석 모자랍니다. 졸업생 처리 방식을 「로그인 차단 + 라이선스 회수」로 바꾸거나 신입생 수를 줄이세요.</div>":"");

   +'<div class="wz"><div class="wz-steps">'

   +'</div><div class="wz-body">'+b+'</div><div class="wz-foot">'

function runPromote(){
  const W=S.wz;
  if(!W.grad){toast("졸업생 처리 방식을 먼저 고르세요.","no");W.step=2;render();return;}
  const g3=S.users.filter(u=>u.grade===3&&u.signIn==="허용");
  const free=CAP[LIC_S]-used(LIC_S)+(W.grad!=="keep"?g3.length:0);
  if(W.parsed.length>free){toast("라이선스가 부족합니다.","no");return;}
  const log=[];
  if(W.grad==="delete"){
    const ids=g3.map(u=>u.id);
    S.users=S.users.filter(u=>ids.indexOf(u.id)<0);
    log.push("졸업생 "+g3.length+"명 계정 삭제 (30일 내 복원 가능), 라이선스 "+g3.length+"석 회수");
  }else{
    g3.forEach(function(u){u.signIn="차단";u.grade=9;u.group="졸업";if(W.grad==="block")u.license="";});
    log.push("졸업생 "+g3.length+"명 로그인 차단"+(W.grad==="block"?", 라이선스 "+g3.length+"석 회수":", 라이선스 유지"));
  }
  [[2,3],[1,2]].forEach(function(p){
    const us=S.users.filter(u=>u.grade===p[0]);
    us.forEach(function(u){
      u.grade=p[1];u.group=GRP[p[1]];
      /* 아이디(입학연도+학번)는 절대 바뀌지 않는다. 학급형 표시 이름만 새 학적으로 갱신 — 클래스이음이 하는 일 */
      if(/^\[/.test(u.disp))u.disp=fmtCls(u);
    });
    log.push(p[0]+"학년 → "+p[1]+"학년 "+us.length+"명 그룹 재배치");
  });
  let made=0;
  W.parsed.forEach(function(r){
    if(S.users.some(u=>u.upn===r.upn))return;
    S.users.push({id:"n"+r.upn+Date.now()+made,last:r.last,first:r.first,disp:r.disp,upn:r.upn,
      grade:1,cls:+r.upn.charAt(1)*10+ +r.upn.charAt(2),no:+r.upn.slice(3),group:GRP[1],
      license:LIC_S,role:"사용자",mfa:"사용 안 함",signIn:"허용",seen:"-"});
    made++;
  });
  if(made)log.push("신입생 "+made+"명 계정 생성, 라이선스 "+made+"석 할당");
  log.push("실행일: "+today()+" / 학생용 라이선스 잔여 "+(CAP[LIC_S]-used(LIC_S))+"석");
  S.log=log;done("m3");if(made)done("m4");S.wz=wzInit();save();render();
  modal({title:"진급 처리 완료",
    body:'<div class="note g">아래 작업이 실행되었습니다.</div><ul style="line-height:2;padding-left:20px;margin:0">'+log.map(l=>"<li>"+esc(l)+"</li>").join("")+"</ul>"
     +'<div class="note w" style="margin-top:16px"><b>다음 단계</b><br>① Argos에서 단말 진급 처리도 함께 실행하세요.<br>② 학급 Teams 팀은 보관 또는 삭제하고 소유자를 2명 이상 유지하세요.<br>③ 졸업생 라이선스 회수가 실제로 반영됐는지 「라이선스」에서 확인하세요.</div>',
    foot:'<button class="btn pri" data-close>확인</button><button class="btn" id="dlLog">'+I.dl+" 결과 내려받기</button>",
    onMount:function(ov){ov.querySelector("#dlLog").addEventListener("click",exportLog);}});
}
function exportLog(){
  const L=["학년 진급 처리 결과 (연수 실습)","학교: 디벗중학교(가상)   실행일: "+today(),""];
  (S.log.length?S.log:["아직 실행하지 않았습니다."]).forEach(l=>L.push("- "+l));
  L.push("");L.push("[현재 학년별 계정 수]");
  [1,2,3].forEach(g=>L.push("  "+g+"학년: "+S.users.filter(u=>u.grade===g).length+"명"));
  L.push("  교직원: "+S.users.filter(u=>u.grade===0).length+"명");
  L.push("  졸업(차단): "+S.users.filter(u=>u.grade===9).length+"명");
  L.push("");L.push("[라이선스]");
  L.push("  "+LIC_S+": "+used(LIC_S)+" / "+CAP[LIC_S]+"석");
  L.push("  "+LIC_T+": "+used(LIC_T)+" / "+CAP[LIC_T]+"석");
  L.push("");L.push("[MFA]");
  MFA.forEach(m=>L.push("  "+m+": "+S.users.filter(u=>u.mfa===m).length+"명"));
  L.push("");L.push("※ 연수용 실습기에서 생성한 연습 결과입니다.");
  const b=new Blob([L.join("\n")],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="진급처리_결과_"+today()+".txt";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast("결과를 내려받았습니다.","ok");
}

function genPw(){
  const A="ABCDEFGHJKMNPQRSTUVWXYZ",a="abcdefghjkmnpqrstuvwxyz",d="23456789",s="!@#$%";
  const p=t=>t[Math.floor(Math.random()*t.length)];
  return p(A)+p(a)+p(a)+p(d)+p(d)+p(d)+p(s)+p(a);
}

  }

document.addEventListener("change",function(e){
  const t=e.target;let n;
  if((n=t.closest("[data-pick]"))){
    const id=n.getAttribute("data-pick"),i=S.ui.sel.indexOf(id);
    if(t.checked&&i<0)S.ui.sel.push(id);else if(!t.checked&&i>=0)S.ui.sel.splice(i,1);
    save();render();return;
  }
  if(t.closest("[data-all]")){S.ui.sel=t.checked?filt().map(u=>u.id):[];save();render();return;}
  if(t.id==="fg"){S.ui.fg=t.value;S.ui.sel=[];if(t.value===GRP[3])done("m1");save();render();return;}
  if(t.id==="fm"){S.ui.fm=t.value;S.ui.sel=[];save();render();return;}
  if(t.name==="grad"){S.wz.grad=t.value;done("m2");save();render();return;}
});
document.addEventListener("input",function(e){
  if(e.target.id==="uq"){S.ui.q=e.target.value;clearTimeout(tt);}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="uq"){S.ui.q=e.target.value;save();render();}
});
function wCommit(){
  const c=$("#csv");
  if(c&&S.wz){
    S.wz.csv=c.value;
    if(c.value.trim()){const r=parseCsv(c.value);S.wz.parsed=r.rows;S.wz.err=r.err.join(" · ");}
    else{S.wz.parsed=[];S.wz.err="";}
  }
}

let GD=null;
function guidePaint(){
  const bar=$("#guideBar"),co=$("#coach");
  if(!GD){bar.hidden=true;co.hidden=true;return;}
  const g=GUIDE[GD.id],st=g.steps[GD.i];
  bar.hidden=false;
  bar.innerHTML='🎯 <b>'+esc(g.n)+'</b> 수행 중 · 단계 '+(GD.i+1)+"/"+g.steps.length
    +' — '+esc(st.t)+' <button id="gdStop">안내 중단</button>';
  co.hidden=false;
  co.innerHTML='<div class="c-t">'+(GD.i+1)+"단계 · "+esc(st.t)+'</div>'
    +'<div class="c-d">'+esc(st.d||"")+'</div>'
    +'<div class="c-s">반짝이는 곳을 누르면 다음 단계로 넘어갑니다 ('+(GD.i+1)+"/"+g.steps.length+")</div>";
  document.querySelectorAll(".guide-glow").forEach(function(e2){e2.classList.remove("guide-glow");});
  if(st.page&&S.ui.page!==st.page)return;
  const el=document.querySelector(st.sel);
  if(el&&!el.disabled)el.classList.add("guide-glow");
}
function guideStop(){
  GD=null;
  document.querySelectorAll(".guide-glow").forEach(function(e2){e2.classList.remove("guide-glow");});
  guidePaint();
}
function guideStart(id){
  const g=GUIDE[id];
  if(!g){toast("이 미션은 화면 안내 없이 자유롭게 진행하는 미션입니다.","no");return;}
  GD={id:id,i:0,replay:!!S.missions[id]};
  const st=g.steps[0];
  if(st.page&&S.ui.page!==st.page)go(st.page);
  $("#mp").hidden=true;
  modal({title:"🎯 "+g.n+(GD.replay?" (복습)":""),
    body:'<p class="lead">'+g.steps.map(function(s2,i){return (i+1)+"단계 "+s2.t;}).join("  →  ")+"</p>"
     +'<div class="note i">화면에서 <b>노랗게 반짝이는 곳</b>을 따라가세요. 왼쪽 아래 안내 카드에 각 단계의 설명이 뜹니다.</div>',
    foot:'<button class="btn pri" data-close>시작</button>'});
  guidePaint();
}
function guideAdvance(){
  const g=GUIDE[GD.id];
  if(GD.i<g.steps.length-1){
    GD.i++;
    const ns=g.steps[GD.i];
    if(ns.page&&S.ui.page!==ns.page)setTimeout(function(){go(ns.page);},60);
    toast("✔ 단계 완료 — 다음: "+ns.t,"ok");
    guidePaint();
  }else{
    GD.fin=true;
  }
}
setInterval(function(){
  if(!GD)return;
  if((S.missions[GD.id]&&!GD.replay)||GD.fin){
    if(document.querySelector(".modal"))return;   /* 결과 팝업을 먼저 닫게 */
    const nm=GUIDE[GD.id].n;guideStop();
    modal({title:"미션 클리어! 🎉",
      body:'<div class="note g"><b>'+esc(nm)+'</b> 완료! 우측 아래 미션 패널에 체크되었습니다.<br>허브로 돌아가면 스테이지 진행률에 바로 반영됩니다.</div>',
      foot:'<button class="btn pri" data-close>확인</button>'});
    render();return;
  }
  guidePaint();
},450);
document.addEventListener("click",function(e){
  if(e.target.closest("#gdStop")){guideStop();toast("안내 모드를 중단했습니다. 미션 패널에서 다시 시작할 수 있습니다.","no");return;}
  const gm=e.target.closest("[data-guide]");
  if(gm){guideStart(gm.getAttribute("data-guide"));return;}
  if(!GD)return;
  const st=GUIDE[GD.id].steps[GD.i];
  if(st.ev)return;
  if(e.target.closest(st.sel))guideAdvance();
},true);
document.addEventListener("input",function(e){
  if(!GD)return;const st=GUIDE[GD.id].steps[GD.i];
  if(st.ev!=="input")return;
  if(e.target.closest(st.sel)&&String(e.target.value||"").trim().length>=(st.min||2))guideAdvance();
},true);
document.addEventListener("change",function(e){
  if(!GD)return;const st=GUIDE[GD.id].steps[GD.i];
  if(st.ev!=="change")return;
  if(e.target.closest(st.sel))guideAdvance();
},true);

     +'<div class="note i">서울특별시교육청 <b>디벗 전문가(테크니션) 직무연수 「윈도우 ADMIN · MDM UI 안내」</b> 실습용 재현본입니다. '
     +'실제 테넌트·계정·단말에는 어떤 영향도 주지 않으며, 데이터는 전부 가상입니다.</div>',
    foot:'<button class="btn pri" data-close>확인</button>'});

function boot(){
  S=load();
  if(!S.wz)S.wz=wzInit();
  if(!S.ui.theme)S.ui.theme=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  document.documentElement.setAttribute("data-theme",S.ui.theme);
  CREDIT=$("#app-credit");
  render();
  popCredit();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
window.addEventListener("beforeunload",save);
