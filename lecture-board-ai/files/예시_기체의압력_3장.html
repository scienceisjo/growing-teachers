<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기체의 압력 칠판 강의 화면</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#f1f5f9}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:#0f172a;transform-origin:0 0;overflow:hidden;user-select:none}
  .scene{position:absolute;inset:0;visibility:hidden}
  .scene.on{visibility:visible}
  .sh{opacity:0;transition:opacity .5s}
  .sh.on{opacity:1}
  .title{position:absolute;left:80px;top:50px;font-size:60px;font-weight:800;margin:0;letter-spacing:-1px}
  .title span{color:#38bdf8}
  .cv{position:absolute}
  .tag{position:absolute;left:100px;top:70px;font-size:36px;color:#94a3b8;font-weight:700}
  .q{position:absolute;left:940px;top:300px;width:880px;font-size:64px;line-height:1.5;font-weight:800;margin:0}
  .q em{font-style:normal;color:#fde047}
  .txt{position:absolute;left:1030px;top:190px;width:800px}
  .txt p{font-size:38px;line-height:2.05;margin:0 0 36px;font-weight:500}
  .blank{display:inline-block;border-bottom:4px solid #cbd5e1;padding:0 10px 0 4px;margin:0 6px;white-space:nowrap;vertical-align:baseline;line-height:1.6}
  .no{display:inline-block;width:42px;height:42px;line-height:42px;border-radius:50%;background:#2563eb;color:#fff;font-size:26px;font-weight:800;text-align:center;vertical-align:middle;margin-right:8px;font-style:normal}
  .ans{display:inline-block;color:#fde047;font-weight:800;vertical-align:baseline;min-height:1px}
  .legend{position:absolute;font-size:26px;color:#94a3b8}
  .nav{position:absolute;left:0;right:0;bottom:22px;height:40px}
  .dots{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:18px;top:6px}
  .dots i{width:22px;height:22px;border-radius:50%;background:#334155;display:block}
  .dots i.on{background:#38bdf8}
  .hint{position:absolute;right:60px;top:0;font-size:24px;color:#64748b}
</style>
</head>
<body>
<div id="stage">

  <!-- 장면 1 표지 -->
  <section class="scene" id="sc0">
    <div class="tag">중1 과학 · 기체의 성질</div>
    <canvas class="cv" id="cv0" style="left:100px;top:200px"></canvas>
    <p class="q sh" data-show="1">과자 봉지 속은 꽉 차 있지도 않은데 <em>왜 빵빵하게 버틸까?</em></p>
  </section>

  <!-- 장면 2 개념 -->
  <section class="scene" id="sc1">
    <h1 class="title">기체의 <span>압력</span></h1>
    <canvas class="cv" id="cv1" style="left:70px;top:170px"></canvas>
    <div class="txt">
      <p class="sh" data-show="1">기체의 압력은 일정한 면적에 기체 입자가 (<span class="blank" data-reveal="2" data-ans="충돌" style="min-width:110px"><i class="no">1</i><b class="ans"></b></span>)하여 작용하는 힘이다.</p>
      <p class="sh" data-show="4">기체 입자가 (<span class="blank" data-reveal="5" data-ans="모든 방향" style="min-width:230px"><i class="no">2</i><b class="ans"></b></span>)으로 운동하면서 충돌하므로, 기체의 압력도 (<span class="blank" data-reveal="6" data-ans="모든 방향" style="min-width:230px"><i class="no">3</i><b class="ans"></b></span>)으로 작용한다.</p>
    </div>
  </section>

  <!-- 장면 3 개념 -->
  <section class="scene" id="sc2">
    <h1 class="title">기체의 <span>부피</span>와 압력</h1>
    <canvas class="cv" id="cv2" style="left:70px;top:230px"></canvas>
    <div class="txt" style="top:230px">
      <p class="sh" data-show="2">온도가 같을 때 기체의 부피가 줄어들면 입자가 벽에 충돌하는 (<span class="blank" data-reveal="3" data-ans="횟수" style="min-width:110px"><i class="no">4</i><b class="ans"></b></span>)가 늘어나 기체의 압력이 (<span class="blank" data-reveal="4" data-ans="커진다" style="min-width:150px"><i class="no">5</i><b class="ans"></b></span>).</p>
    </div>
  </section>

  <div class="nav">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="hint">→ 다음 · ← 이전</div>
  </div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){
    var s=Math.min(innerWidth/1920,innerHeight/1080);
    stage.style.transform='scale('+s+') translate(-50%,-50%)';
    stage.style.transformOrigin='0 0';
    stage.style.left='50%';stage.style.top='50%';
  }
  fit();addEventListener('resize',fit);

  /* ---------- 입자 시뮬레이션 ---------- */
  function makeSim(o){
    var ps=o.pos.map(function(p,i){return {x:p[0],y:p[1],vx:Math.cos(o.ang[i])*o.speed,vy:Math.sin(o.ang[i])*o.speed};});
    var fl=[], R=o.r;
    function flash(x,y){ if(fl.length<80) fl.push({x:x,y:y,t:.32}); }
    function sub(h){
      if(o.pre) o.pre(h);
      var b=o.bounds(), i, j, p, q;
      for(i=0;i<ps.length;i++){
        p=ps[i]; p.x+=p.vx*h; p.y+=p.vy*h;
        if(p.x-R<b.l){p.x=b.l+R;p.vx=Math.abs(p.vx);flash(b.l,p.y);}
        if(p.x+R>b.r){p.x=b.r-R;p.vx=-Math.abs(p.vx);flash(b.r,p.y);}
        if(p.y-R<b.t){p.y=b.t+R;p.vy=Math.abs(p.vy);flash(p.x,b.t);}
        if(p.y+R>b.b){p.y=b.b-R;p.vy=-Math.abs(p.vy);flash(p.x,b.b);}
      }
      for(i=0;i<ps.length;i++)for(j=i+1;j<ps.length;j++){
        p=ps[i];q=ps[j];
        var dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;
        if(d2<4*R*R&&d2>0.0001){
          var d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
          var rel=(p.vx-q.vx)*nx+(p.vy-q.vy)*ny;
          if(rel>0){var tx=p.vx,ty=p.vy;p.vx=q.vx;p.vy=q.vy;q.vx=tx;q.vy=ty;}
          var ov=(2*R-d)/2;
          p.x-=nx*ov;p.y-=ny*ov;q.x+=nx*ov;q.y+=ny*ov;
        }
      }
    }
    return {ps:ps,fl:fl,R:R,
      step:function(dt){
        dt=Math.min(dt,.05);var left=dt;
        while(left>0){var h=Math.min(left,1/120);left-=h;sub(h);}
        for(var i=fl.length-1;i>=0;i--){fl[i].t-=dt;if(fl[i].t<=0)fl.splice(i,1);}
      }};
  }
  function setupCanvas(id,w,h){
    var c=document.getElementById(id);c.width=w*2;c.height=h*2;c.style.width=w+'px';c.style.height=h+'px';
    var x=c.getContext('2d');x.scale(2,2);return x;
  }
  function drawParts(x,sim){
    sim.fl.forEach(function(f){
      var a=f.t/.32,rad=12+(1-a)*26;
      x.beginPath();x.arc(f.x,f.y,rad,0,7);x.fillStyle='rgba(253,224,71,'+(a*.55)+')';x.fill();
      x.lineWidth=3;x.strokeStyle='rgba(254,240,138,'+a+')';x.stroke();
    });
    sim.ps.forEach(function(p){
      x.beginPath();x.arc(p.x,p.y,sim.R,0,7);x.fillStyle='#38bdf8';x.fill();
      x.lineWidth=2.5;x.strokeStyle='#e0f2fe';x.stroke();
    });
  }
  function arrow(x,x1,y1,x2,y2){
    var a=Math.atan2(y2-y1,x2-x1);
    x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.lineWidth=8;x.lineCap='round';x.stroke();
    x.beginPath();x.moveTo(x2,y2);x.lineTo(x2-26*Math.cos(a-.5),y2-26*Math.sin(a-.5));
    x.lineTo(x2-26*Math.cos(a+.5),y2-26*Math.sin(a+.5));x.closePath();x.fill();
  }

  /* ---------- 장면 1: 과자 봉지 ---------- */
  var c0=setupCanvas('cv0',760,640);
  var sim0=makeSim({r:14,speed:240,
    pos:[[220,200],[330,420],[440,230],[520,400],[290,300],[560,190]],
    ang:[.5,2.2,4.0,5.3,1.2,3.4],
    bounds:function(){return {l:150,r:610,t:140,b:500};}});
  function drawBag(){
    var x=c0;x.clearRect(0,0,760,640);
    x.beginPath();x.moveTo(110,90);x.quadraticCurveTo(70,320,110,550);x.lineTo(650,550);
    x.quadraticCurveTo(690,320,650,90);x.closePath();
    x.fillStyle='rgba(251,146,60,.22)';x.fill();x.lineWidth=6;x.strokeStyle='#fb923c';x.stroke();
    [[90,40],[550,600]].forEach(function(s){
      var y0=s[0]===90?90:550,dir=s[0]===90?-1:1;
      x.beginPath();x.moveTo(110,y0);
      for(var i=0;i<=18;i++){x.lineTo(110+i*30,y0+(i%2?0:dir*40));}
      x.lineTo(650,y0);x.closePath();
      x.fillStyle='rgba(251,146,60,.4)';x.fill();x.stroke();
    });
    drawParts(x,sim0);
  }

  /* ---------- 장면 2: 상자 속 입자 ---------- */
  var c1=setupCanvas('cv1',900,730);
  var sim1=makeSim({r:14,speed:300,
    pos:[[200,200],[450,190],[700,210],[220,350],[460,360],[690,340],[210,500],[450,510],[700,490]],
    ang:[.4,2.0,3.7,5.0,1.1,2.9,4.4,.9,5.8],
    bounds:function(){return {l:100,r:800,t:100,b:600};}});
  var arrowA=0,arrowT=0;
  function drawS2(dt){
    var x=c1;x.clearRect(0,0,900,730);
    x.fillStyle='rgba(56,189,248,.07)';x.fillRect(100,100,700,500);
    x.lineWidth=10;x.strokeStyle='#e2e8f0';x.strokeRect(100,100,700,500);
    arrowA+=(arrowT-arrowA)*Math.min(1,dt*8);
    if(arrowA>.01){
      x.globalAlpha=arrowA;x.strokeStyle='#fb923c';x.fillStyle='#fb923c';
      [250,450].forEach(function(y){arrow(x,88,y,28,y);arrow(x,812,y,872,y);});
      [300,600].forEach(function(px){arrow(x,px,88,px,28);arrow(x,px,612,px,672);});
      x.font='700 26px "Malgun Gothic",sans-serif';x.textAlign='center';x.fillText('벽에 작용하는 힘',450,715);
      x.globalAlpha=1;
    }
    drawParts(x,sim1);
  }

  /* ---------- 장면 3: 피스톤 ---------- */
  var c2=setupCanvas('cv2',900,640);
  var pist=760,pistT=760;
  var sim2=makeSim({r:14,speed:300,
    pos:[[130,190],[215,190],[300,190],[385,190],[130,370],[215,370],[300,370],[385,370]],
    ang:[.7,2.4,4.1,5.5,1.5,3.1,.2,4.8],
    bounds:function(){return {l:80,r:pist,t:120,b:520};},
    pre:function(h){var d=pistT-pist,m=240*h;pist+=Math.abs(d)<=m?d:(d>0?m:-m);}});
  var noteA=0,noteT=0;
  function drawS3(dt){
    var x=c2;x.clearRect(0,0,900,640);
    x.fillStyle='rgba(56,189,248,.07)';x.fillRect(80,120,pist-80,400);
    x.strokeStyle='#e2e8f0';x.lineWidth=10;x.lineCap='butt';
    x.beginPath();x.moveTo(80,515);x.lineTo(80,120);x.lineTo(870,120);x.stroke();
    x.beginPath();x.moveTo(80,520);x.lineTo(870,520);x.stroke();
    x.fillStyle='#94a3b8';x.fillRect(pist,114,18,412);
    x.fillStyle='#64748b';x.fillRect(pist+18,310,130,20);x.fillRect(pist+148,270,22,100);
    x.font='700 28px "Malgun Gothic",sans-serif';x.fillStyle='#cbd5e1';x.textAlign='center';
    x.fillText('피스톤',pist+9,95);
    noteA+=(noteT-noteA)*Math.min(1,dt*8);
    if(noteA>.01){x.globalAlpha=noteA;x.fillStyle='#fde047';x.font='700 28px "Malgun Gothic",sans-serif';x.textAlign='center';
      x.fillText('입자의 수·크기·빠르기는 그대로',450,600);x.globalAlpha=1;}
    drawParts(x,sim2);
  }

  /* ---------- 단계 관리 ---------- */
  var steps=[2,7,5],total=steps.reduce(function(a,b){return a+b;},0);
  var g=0;
  var scenes=[].slice.call(document.querySelectorAll('.scene'));
  var dots=[].slice.call(document.querySelectorAll('.dots i'));
  function locate(){var s=0,k=g;while(k>=steps[s]){k-=steps[s];s++;}return {s:s,k:k};}
  function render(){
    var L=locate();
    scenes.forEach(function(el,i){el.classList.toggle('on',i===L.s);});
    dots.forEach(function(d,i){d.classList.toggle('on',i===L.s);});
    var sc=scenes[L.s];
    [].forEach.call(sc.querySelectorAll('[data-show]'),function(el){
      el.classList.toggle('on',L.k>=+el.getAttribute('data-show'));
    });
    [].forEach.call(sc.querySelectorAll('[data-reveal]'),function(el){
      var open=L.k>=+el.getAttribute('data-reveal');
      el.querySelector('.ans').textContent=open?el.getAttribute('data-ans'):'';
    });
    arrowT=(L.s===1&&L.k>=3)?1:0;
    pistT=(L.s===2&&L.k>=1)?440:760;
    noteT=(L.s===2&&L.k>=1)?1:0;
    /* 장면 3 안내 글은 표 장면에서만 쓰이므로 다른 장면에서는 0 */
    if(L.s!==2){noteT=0;}
  }
  function go(d){
    var n=Math.max(0,Math.min(total-1,g+d));
    if(n!==g){g=n;render();}
  }
  addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.code==='Space'){e.preventDefault();go(1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  });
  stage.addEventListener('click',function(){go(1);});

  /* ---------- 그리기 루프 ---------- */
  var last=performance.now();
  function loop(t){
    var dt=Math.min((t-last)/1000,.05);last=t;
    var L=locate();
    if(L.s===0){sim0.step(dt);drawBag();}
    else if(L.s===1){sim1.step(dt);drawS2(dt);}
    else{sim2.step(dt);drawS3(dt);}
    requestAnimationFrame(loop);
  }
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
